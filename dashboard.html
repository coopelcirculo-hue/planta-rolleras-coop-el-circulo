const {useState,useEffect,useRef}=React;

function useMobile(){ const [m,setM]=useState(window.innerWidth<768); useEffect(()=>{const h=()=>setM(window.innerWidth<768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);return m; }

function Field({label,children}){return(<div style={{marginBottom:14}}><label style={{display:"block",color:GR,fontSize:11,marginBottom:5,letterSpacing:1}}>{label.toUpperCase()}</label>{children}</div>);}
function Modal({title,children,onClose}){return(<div style={{position:"fixed",inset:0,background:"#000c",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16}}><div style={{background:CB,border:"1px solid "+BR,borderRadius:16,padding:28,width:440,maxWidth:"95vw",maxHeight:"90vh",overflowY:"auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><h3 style={{color:W,fontFamily:"Orbitron,sans-serif",fontSize:15,margin:0}}>{title}</h3><button onClick={onClose} style={{background:"transparent",border:"none",color:GR,cursor:"pointer",fontSize:20}}>✕</button></div>{children}</div></div>);}

// ── Header ───────────────────────────────────────────────────────────────────
// En el celular las etiquetas se acortan y la barra scrollea en horizontal,
// así ninguna pestaña queda cortada.
const TABS=[["monitoreo","🟢","Monitoreo","Monitoreo"],
            ["maquinas","🔧","Máquinas y eventos","Máquinas"],
            ["cargar","📝","Cargar hoja","Cargar"],
            ["produccion","📊","Producción","Datos"]];

function Header({nombre,tab,setTab,isMobile}){
  const logout=async()=>{await clearSess();window.location.href="index.html";};
  return(<div style={{background:"#0c1420",borderBottom:"1px solid "+BR,flexShrink:0}}>
    <div style={{padding:isMobile?"12px 14px":"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
      <div style={{minWidth:0}}>
        <div style={{fontFamily:"Orbitron,sans-serif",fontSize:isMobile?11:13,color:O,letterSpacing:1,whiteSpace:"nowrap"}}>🏭 PLANTA ROLLERAS</div>
        <div style={{fontSize:10,color:GR,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Coop El Círculo{nombre?" · "+nombre:""}</div>
      </div>
      <button onClick={logout} style={{...Btn("transparent",RE,{padding:"7px 12px",fontSize:12,flexShrink:0})}}>🚪{isMobile?"":" Salir"}</button>
    </div>
    <div className="barra-tabs" style={{display:"flex",gap:2,padding:"0 10px",overflowX:"auto"}}>
      {TABS.map(([id,ic,largo,corto])=>(
        <button key={id} onClick={()=>setTab(id)} style={{padding:isMobile?"10px 11px":"9px 14px",border:"none",borderBottom:"2px solid "+(tab===id?O:"transparent"),background:"transparent",color:tab===id?O:GR,cursor:"pointer",fontSize:12,fontWeight:tab===id?700:400,fontFamily:"Montserrat,sans-serif",whiteSpace:"nowrap",flexShrink:0}}>
          {ic} {isMobile?corto:largo}

// ── Formularios ──────────────────────────────────────────────────────────────
function MaquinaForm({init,onSave,onClose}){
  const [f,setF]=useState(init);const s=(k,v)=>setF(x=>({...x,[k]:v}));
  return(<>
    <Field label="Código (fijo, viene de la hoja de control)"><input style={{...inp,opacity:0.6}} value={f.codigo} disabled/></Field>
    <Field label="Nombre / apodo (opcional)"><input style={inp} value={f.nombre||""} onChange={e=>s("nombre",e.target.value)} placeholder="Ej: Rolladora chica"/></Field>
    <Field label="Notas (opcional)"><textarea style={{...inp,minHeight:70,resize:"vertical"}} value={f.notas||""} onChange={e=>s("notas",e.target.value)}/></Field>
    <Field label="Estado">
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>s("activa",true)} style={{...Btn(f.activa!==false?GN:"transparent",f.activa!==false?D:GR,{flex:1}) }}>✓ Activa</button>
        <button onClick={()=>s("activa",false)} style={{...Btn(f.activa===false?RE:"transparent",f.activa===false?W:GR,{flex:1}) }}>⏸ Fuera de servicio</button>
      </div>
    </Field>
    <div style={{display:"flex",gap:10,marginTop:8}}>
      <button onClick={onClose} style={{...Btn("transparent",GR),flex:1}}>Cancelar</button>
      <button onClick={()=>onSave(f)} style={{...Btn(O,D),flex:1}}>Guardar</button>
    </div>
  </>);
}

// ── Stat card ────────────────────────────────────────────────────────────────

// ── Máquinas (grid) ──────────────────────────────────────────────────────────
function MaquinasGrid({maquinas,eventos,onEditar,onNuevoEvento}){
  const pendPorMaquina = id => eventos.filter(e=>e.maquinaId===id&&!e.resuelto).length;
  return(<div>
    <h3 style={{color:W,fontSize:13,marginBottom:12,fontWeight:700}}>🏭 Máquinas</h3>
    {maquinas.length===0?(
      <div style={{textAlign:"center",padding:40,color:GR,background:CA,border:"1px solid "+BR,borderRadius:12}}>
        <div style={{fontSize:36,marginBottom:10}}>🏭</div>
        <p>Todavía no hay máquinas cargadas. Aparecen solas la primera vez que se sube una hoja de control con esa máquina.</p>
      </div>
    ):(
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
        {maquinas.map(m=>{
          const pend=pendPorMaquina(m.id);
          return(<div key={m.id} style={{background:CA,border:"1px solid "+(m.activa===false?RE+"44":(pend>0?O+"44":BR)),borderRadius:12,padding:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
              <div>
                <div style={{color:W,fontWeight:700,fontSize:13}}>Máquina {m.codigo}</div>
                {m.nombre&&<div style={{color:GR,fontSize:10,marginTop:2}}>{m.nombre}</div>}
              </div>
              <button onClick={()=>onEditar(m)} style={{...Btn("transparent",GR,{padding:"3px 7px",fontSize:11})}}>✏️</button>
            </div>
            {m.activa===false&&<span style={{background:RE+"22",color:RE,fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:20}}>FUERA DE SERVICIO</span>}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
              <span style={{fontSize:11,color:pend>0?O:GN,fontWeight:700}}>{pend>0?pend+" pendiente"+(pend!==1?"s":""):"✓ sin pendientes"}</span>
              <button onClick={()=>onNuevoEvento(m)} style={{...Btn("transparent",O,{padding:"5px 10px",fontSize:11,borderColor:O})}}>+ Evento</button>
            </div>
          </div>);
        })}
      </div>
    )}
  </div>);
}

// ── Eventos (feed) ───────────────────────────────────────────────────────────
function EventosFeed({eventos,maquinas,onResolver,onEliminar}){
  const [filtroEstado,setFiltroEstado]=useState("pendientes");
  const [filtroTipo,setFiltroTipo]=useState("todos");
  const nombreMaquina = id => { const m=maquinas.find(x=>x.id===id); return m ? tituloMaquina(m.codigo)+(m.nombre?" — "+m.nombre:"") : "—"; };

  const fil = eventos.filter(e=>{
    if(filtroEstado==="pendientes"&&e.resuelto) return false;
    if(filtroEstado==="resueltos"&&!e.resuelto) return false;
    if(filtroTipo!=="todos"&&e.tipo!==filtroTipo) return false;
    return true;
  });

  return(<div style={{marginTop:24}}>
    <h3 style={{color:W,fontSize:13,marginBottom:12,fontWeight:700}}>📋 Historial de eventos</h3>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
      {[["pendientes","Pendientes"],["resueltos","Resueltos"],["todos","Todos"]].map(([id,lbl])=>(
        <button key={id} onClick={()=>setFiltroEstado(id)} style={{...Btn(filtroEstado===id?O:"transparent",filtroEstado===id?D:GR,{padding:"5px 12px",fontSize:11})}}>{lbl}</button>
      ))}
      <span style={{width:1,background:BR,margin:"0 4px"}}/>
      <button onClick={()=>setFiltroTipo("todos")} style={{...Btn(filtroTipo==="todos"?W:"transparent",filtroTipo==="todos"?D:GR,{padding:"5px 12px",fontSize:11})}}>Todos los tipos</button>
      {TIPOS_EVENTO.map(t=>(
        <button key={t.id} onClick={()=>setFiltroTipo(t.id)} style={{...Btn(filtroTipo===t.id?t.color:"transparent",filtroTipo===t.id?D:GR,{padding:"5px 12px",fontSize:11})}}>{t.icon} {t.label}</button>
      ))}
    </div>
    {fil.length===0?(
      <p style={{color:GR,fontSize:12,textAlign:"center",padding:20}}>No hay eventos en este filtro.</p>
    ):(
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {fil.map(e=>{
          const t=tipoInfo(e.tipo);
          return(<div key={e.id} style={{background:CA,border:"1px solid "+BR,borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:200}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                <span style={{background:t.color+"22",color:t.color,fontSize:10,fontWeight:700,padding:"2px 9px",borderRadius:20}}>{t.icon} {t.label}</span>
                <span style={{color:W,fontWeight:700,fontSize:12}}>{nombreMaquina(e.maquinaId)}</span>
                <span style={{color:GR,fontSize:11}}>{fdate(e.fecha)}</span>
              </div>
              <div style={{color:GR,fontSize:12}}>{e.descripcion}</div>
              {e.resuelto&&<div style={{color:GN,fontSize:10,marginTop:4}}>✓ Resuelto {e.resueltoFecha?"el "+fdate(e.resueltoFecha):""}</div>}
              {e.creadoPor&&<div style={{color:GR,fontSize:10,marginTop:4}}>Cargado por {e.creadoPor}</div>}
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <button onClick={()=>onResolver(e)} style={{...Btn(e.resuelto?"transparent":GN,e.resuelto?GR:D,{padding:"6px 10px",fontSize:11})}}>{e.resuelto?"↺ Reabrir":"✓ Resolver"}</button>
              <button onClick={()=>onEliminar(e)} style={{...Btn("transparent",RE,{padding:"6px 10px",fontSize:11,borderColor:RE+"55"})}}>✕</button>
            </div>
          </div>);
        })}
      </div>
    )}
  </div>);
}

// ── Monitoreo en vivo ────────────────────────────────────────────────────────
function duracion(desde,hasta){
  const min=Math.max(0,Math.floor(((hasta?new Date(hasta):new Date())-new Date(desde))/60000));
  if(min<60) return min+" min";
  const h=Math.floor(min/60),m=min%60;
  if(h<24) return h+" h"+(m?" "+m+"m":"");
  const d=Math.floor(h/24);
  return d+" d"+(h%24?" "+(h%24)+"h":"");
}

  const valido = f.estado==="produciendo" ? f.medida.trim() : true;
  const guardar=async()=>{ setGuardando(true); await onSave(f); setGuardando(false); };
  return(<>
    <Field label="Estado">
      <div style={{display:"flex",gap:8}}>
        {ESTADOS.map(e=>(<button key={e.id} onClick={()=>s("estado",e.id)} style={{...Btn(f.estado===e.id?e.color:"transparent",f.estado===e.id?D:GR,{flex:1,fontSize:12,borderColor:e.color})}}>{e.icon} {e.label}</button>))}

      </Field>

        {MOTIVOS_PARADA.map(m=>(<button key={m} onClick={()=>s("motivo",m)} style={{...Btn(f.motivo===m?O:"transparent",f.motivo===m?D:GR,{padding:"5px 11px",fontSize:11})}}>{m}</button>))}
      </div>
      <input style={inp} value={f.motivo} onChange={e=>s("motivo",e.target.value)} placeholder="O escribí otro motivo..."/>

    <div style={{display:"flex",gap:10,marginTop:8}}>
      <button onClick={onClose} style={{...Btn("transparent",GR),flex:1}}>Cancelar</button>
      <button onClick={guardar} disabled={!valido||guardando} style={{...Btn(O,D,{opacity:valido&&!guardando?1:0.5}),flex:1}}>{guardando?"Guardando...":"Guardar"}</button>
    </div>

function TarjetaMaquina({fila,onCambiar,onHistorial,onBorrar}){
  const info=estadoInfo(fila.estado);
  const color=info?info.color:BR;
  const sinRegistro=!fila.estado;
  return(<div style={{background:CA,border:"1px solid "+(sinRegistro?BR:color+"66"),borderRadius:14,padding:16,display:"flex",flexDirection:"column",gap:10}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
      <div>
        <div style={{color:W,fontWeight:700,fontSize:15}}>{tituloMaquina(fila.maquina)}</div>
        {fila.maquina_nombre&&<div style={{color:GR,fontSize:10,marginTop:2}}>{fila.maquina_nombre}</div>}
      </div>
      <span style={{background:(sinRegistro?GR:color)+"22",color:sinRegistro?GR:color,fontSize:10,fontWeight:700,padding:"4px 10px",borderRadius:20,whiteSpace:"nowrap"}}>
        {sinRegistro?"SIN REGISTRO":info.icon+" "+info.label.toUpperCase()}
      </span>
    </div>

    {sinRegistro?(
      <div style={{color:GR,fontSize:12,padding:"8px 0"}}>Todavía no se registró qué está haciendo.</div>
    ):fila.estado==="produciendo"?(
      <div>
        <div style={{fontFamily:"Orbitron,sans-serif",fontSize:21,color:GN,fontWeight:700,letterSpacing:1}}>{fila.medida||"—"}</div>
        {fila.presentacion&&<div style={{color:W,fontSize:13,marginTop:3}}>{fila.presentacion}</div>}

    ):(
      <div style={{color:fila.estado==="parada"?O:GR,fontSize:14,fontWeight:600}}>{fila.motivo||(fila.estado==="parada"?"Parada":"Apagada")}</div>
    )}

    {!sinRegistro&&<div style={{fontSize:11,color:GR,borderTop:"1px solid "+BR,paddingTop:8}}>
      <div>{desdeHace(fila.inicio)} · <span style={{color:W}}>{duracion(fila.inicio)}</span></div>
      <div style={{marginTop:2}}>desde {fhora(fila.inicio)}{fila.creadoPor?" · "+fila.creadoPor:""}</div>
    </div>}

      <button onClick={()=>onCambiar(fila)} style={{...Btn(O,D,{flex:1,fontSize:12,padding:"9px"})}}>Cambiar estado</button>

      <button onClick={()=>onBorrar(fila)} title="Eliminar máquina" style={{...Btn("transparent",RE,{fontSize:12,padding:"9px 11px",borderColor:RE+"55"})}}>✕</button>
    </div>
  </div>);
}

function Monitoreo({perfil}){
  const [filas,setFilas]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [modal,setModal]=useState(null);
  const [historial,setHistorial]=useState(null);
  const [nuevaMaq,setNuevaMaq]=useState(false);
  const [error,setError]=useState("");

  const cargar=async()=>{ setFilas(await db.loadEstadoActual()); setCargando(false); };
  // Refresco automático: el tablero se mantiene al día solo, y los "hace X min" avanzan.
  useEffect(()=>{ cargar(); const i=setInterval(cargar,60000); return ()=>clearInterval(i); },[]);

  const abrirCambio = f => setModal({
    maquinaId:f.maquina_id, maquina:f.maquina,
    estado:f.estado||"produciendo", medida:f.medida||"",
    presentacion:f.presentacion||"", motivo:f.motivo||""
  });

  const guardar = async f => {
    const r = await db.cambiarEstado({...f, creadoPor:perfil?.nombre||""});
    if(!r.ok){ setError(r.detalle); return; }
    setError(""); setModal(null); await cargar();
  };

  const verHistorial = async f => {
    setHistorial({maquina:f.maquina, filas:null});
    setHistorial({maquina:f.maquina, filas:await db.historialEstados(f.maquina_id)});
  };

  const crearMaquina = async (codigo,nombre) => {
    const r = await db.crearMaquina(codigo,nombre);
    if(!r.ok){ setError(r.detalle); return; }
    setError(""); setNuevaMaq(false); await cargar();
  };

  const borrarMaquina = async f => {
    if(!confirm("¿Eliminar "+tituloMaquina(f.maquina)+"? Se borran también sus estados y eventos."))return;
    const r = await db.delMaquina(f.maquina_id);
    if(!r.ok){ setError(r.detalle); return; }
    setError(""); await cargar();
  };

  const cuenta = id => filas.filter(f=>f.estado===id).length;

  if(cargando) return <p style={{color:GR,fontSize:12}}>Cargando...</p>;

  return(<div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:20}}>

    {error&&<div style={{color:RE,fontSize:12,marginBottom:14,padding:10,background:RE+"15",borderRadius:8}}>{error}</div>}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:10,flexWrap:"wrap"}}>
      <h3 style={{color:W,fontSize:13,margin:0,fontWeight:700}}>🏭 Estado de las máquinas</h3>
      <button onClick={()=>setNuevaMaq(true)} style={{...Btn(O,D,{fontSize:12,padding:"7px 14px"})}}>+ Agregar máquina</button>

    {filas.length===0?(
      <div style={{textAlign:"center",padding:40,color:GR,background:CA,border:"1px solid "+BR,borderRadius:12}}>
        <div style={{fontSize:36,marginBottom:10}}>🏭</div>
        <p style={{marginBottom:16}}>Todavía no hay máquinas cargadas.</p>
        <button onClick={()=>setNuevaMaq(true)} style={{...Btn(O,D,{fontSize:12})}}>+ Agregar la primera</button>

      </div>

    {nuevaMaq&&<Modal title="Agregar máquina" onClose={()=>{setNuevaMaq(false);setError("");}}>
      <NuevaMaquinaForm onSave={crearMaquina} onClose={()=>{setNuevaMaq(false);setError("");}}/>
    </Modal>}

    {modal&&<Modal title={tituloMaquina(modal.maquina)} onClose={()=>{setModal(null);setError("");}}>
      <CambiarEstadoForm init={modal} onSave={guardar} onClose={()=>{setModal(null);setError("");}}/>
    </Modal>}

    {historial&&<Modal title={"Historial — "+tituloMaquina(historial.maquina)} onClose={()=>setHistorial(null)}>
      {historial.filas===null?<p style={{color:GR,fontSize:12}}>Cargando...</p>:
       historial.filas.length===0?<p style={{color:GR,fontSize:12}}>Sin registros todavía.</p>:
       <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:400,overflowY:"auto"}}>
        {historial.filas.map(h=>{
          const i=estadoInfo(h.estado);
          return(<div key={h.id} style={{borderLeft:"3px solid "+i.color,paddingLeft:10,paddingTop:4,paddingBottom:4}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
              <span style={{color:i.color,fontSize:11,fontWeight:700}}>{i.icon} {h.estado==="produciendo"?(h.medida||"—")+(h.presentacion?" · "+h.presentacion:""):(h.motivo||i.label)}</span>
              <span style={{color:W,fontSize:11}}>{duracion(h.inicio,h.fin)}</span>
            </div>
            <div style={{color:GR,fontSize:10,marginTop:2}}>
              {fhora(h.inicio)} → {h.fin?fhora(h.fin):"ahora"}{h.creadoPor?" · "+h.creadoPor:""}
            </div>
          </div>);
        })}
       </div>}
    </Modal>}
  </div>);
}

// ── Carga manual de una hoja de control ──────────────────────────────────────
function CargarHoja({perfil,onCargado}){
  const isMobile=useMobile();
  const [maquinas,setMaquinas]=useState([]);
  const [f,setF]=useState({maquina:"",fecha:hoyIso(),turno:"dia",operario:"",medida:"",
                           filas:"",bultos:"",scrapEmpalme:"",scrapRollo:"",observaciones:""});
  const [bobinas,setBobinas]=useState([{n:"1",peso:"",iniciales:"",estado:"BIEN",defecto:""}]);
  const [msg,setMsg]=useState(null);
  const [guardando,setGuardando]=useState(false);
  const s=(k,v)=>setF(x=>({...x,[k]:v}));

  useEffect(()=>{ (async()=>{ const d=await db.loadAll(); setMaquinas(d.maquinas); })(); },[]);

  const setBob=(i,k,v)=>setBobinas(prev=>prev.map((b,j)=>j===i?{...b,[k]:v}:b));
  // La numeración sigue sola desde la última bobina cargada.
  const agregar=()=>setBobinas(prev=>{
    const ult=prev[prev.length-1];
    const sig=ult&&/^\d+$/.test(ult.n)?String(Number(ult.n)+1):"";
    return [...prev,{n:sig,peso:"",iniciales:ult?ult.iniciales:"",estado:"BIEN",defecto:""}];
  });
  const quitar=i=>setBobinas(prev=>prev.length>1?prev.filter((_,j)=>j!==i):prev);

  const conPeso=bobinas.filter(b=>Number(b.peso)>0);
  const kilos=conPeso.reduce((a,b)=>a+Number(b.peso),0);
  const valido=f.maquina&&f.fecha&&conPeso.length>0&&conPeso.every(b=>String(b.n).trim());

  const guardar=async()=>{
    setGuardando(true); setMsg(null);
    const r=await db.cargarParte({...f, bobinas:conPeso});
    setGuardando(false);
    if(!r.ok){ setMsg({tipo:"error",texto:r.detalle}); return; }
    const res=r.resultado||{};
    const adv=(res.advertencias||[]);
    setMsg({tipo:"ok", texto:"✓ Guardado: "+(res.bobinas_insertadas||0)+" bobina(s).", adv});
    setBobinas([{n:"1",peso:"",iniciales:"",estado:"BIEN",defecto:""}]);
    if(onCargado) onCargado();
  };

  const celda={...inp,padding:"7px 8px",fontSize:12};

  return(<div>
    <h3 style={{color:W,fontSize:13,marginBottom:4,fontWeight:700}}>📝 Cargar hoja de control</h3>
    <p style={{color:GR,fontSize:11,marginBottom:16,lineHeight:1.5}}>
      Para cargar una hoja a mano. Si una bobina ya estaba cargada para esa máquina,
      fecha y turno, no se duplica.
    </p>

    <div style={{background:CA,border:"1px solid "+BR,borderRadius:12,padding:16,marginBottom:14}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12}}>
        <Field label="Máquina">
          <select style={inp} value={f.maquina} onChange={e=>s("maquina",e.target.value)}>
            <option value="">Seleccionar...</option>
            {maquinas.map(m=><option key={m.id} value={m.codigo}>{tituloMaquina(m.codigo)}</option>)}
          </select>
        </Field>
        <Field label="Fecha"><input type="date" style={inp} value={f.fecha} onChange={e=>s("fecha",e.target.value)}/></Field>
        <Field label="Turno">
          <div style={{display:"flex",gap:8}}>
            {[["dia","☀️ Día"],["noche","🌙 Noche"]].map(([id,lbl])=>(
              <button key={id} onClick={()=>s("turno",id)} style={{...Btn(f.turno===id?O:"transparent",f.turno===id?D:GR,{flex:1,fontSize:12})}}>{lbl}</button>))}
          </div>
        </Field>
        <Field label="Operario del turno"><input style={inp} value={f.operario} onChange={e=>s("operario",e.target.value)} placeholder="Nombre"/></Field>
        <Field label="Medida"><input style={inp} value={f.medida} onChange={e=>s("medida",e.target.value)} placeholder="45x60x20"/></Field>
        <Field label="Bultos"><input type="number" style={inp} value={f.bultos} onChange={e=>s("bultos",e.target.value)}/></Field>
        <Field label="Scrap empalme (kg)"><input type="number" style={inp} value={f.scrapEmpalme} onChange={e=>s("scrapEmpalme",e.target.value)}/></Field>
        <Field label="Scrap rollo (kg)"><input type="number" style={inp} value={f.scrapRollo} onChange={e=>s("scrapRollo",e.target.value)}/></Field>
      </div>
      <Field label="Observaciones"><input style={inp} value={f.observaciones} onChange={e=>s("observaciones",e.target.value)}/></Field>
    </div>

    <div style={{background:CA,border:"1px solid "+BR,borderRadius:12,padding:16,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{color:W,fontSize:12,fontWeight:700}}>Bobinas</div>
        <div style={{color:GR,fontSize:11}}>{conPeso.length} cargada(s) · <span style={{color:O,fontWeight:700}}>{fnum(kilos)} kg</span></div>
      </div>

      {isMobile?(
        // En el celular cada bobina es una tarjeta: se carga con el pulgar, sin scroll lateral.
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {bobinas.map((b,i)=>(<div key={i} style={{background:D,border:"1px solid "+BR,borderRadius:10,padding:12}}>
            <div style={{display:"flex",gap:8,alignItems:"flex-end",marginBottom:8}}>
              <div style={{width:64}}>
                <div style={{color:GR,fontSize:9,letterSpacing:1,marginBottom:4}}>N°</div>
                <input style={celda} value={b.n} onChange={e=>setBob(i,"n",e.target.value)} inputMode="numeric"/>
              </div>
              <div style={{flex:1}}>
                <div style={{color:GR,fontSize:9,letterSpacing:1,marginBottom:4}}>PESO (KG)</div>
                <input type="number" style={celda} value={b.peso} onChange={e=>setBob(i,"peso",e.target.value)} inputMode="decimal"/>
              </div>
              <div style={{width:84}}>
                <div style={{color:GR,fontSize:9,letterSpacing:1,marginBottom:4}}>INICIALES</div>
                <input style={celda} value={b.iniciales} onChange={e=>setBob(i,"iniciales",e.target.value)}/>
              </div>
              <button onClick={()=>quitar(i)} style={{...Btn("transparent",RE,{padding:"8px 10px",fontSize:12,borderColor:RE+"44"})}}>✕</button>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {[["BIEN",GN],["MAL",RE]].map(([v,c])=>(
                <button key={v} onClick={()=>setBob(i,"estado",v)} style={{...Btn(b.estado===v?c:"transparent",b.estado===v?D:GR,{flex:1,fontSize:12,padding:"9px 4px"})}}>{v}</button>))}
            </div>
            {b.estado==="MAL"&&<input style={{...celda,marginTop:8}} value={b.defecto} onChange={e=>setBob(i,"defecto",e.target.value)} placeholder="Defecto: arrugas, fuelle..."/>}
          </div>))}
        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:540}}>
            <thead><tr>
              {["N°","Peso (kg)","Iniciales","Estado","Defecto",""].map(h=>(
                <th key={h} style={{textAlign:"left",color:GR,fontSize:10,letterSpacing:1,padding:"0 6px 6px 0",whiteSpace:"nowrap"}}>{h.toUpperCase()}</th>))}
            </tr></thead>
            <tbody>
              {bobinas.map((b,i)=>(<tr key={i}>
                <td style={{padding:"0 6px 6px 0",width:70}}><input style={{...celda,width:70}} value={b.n} onChange={e=>setBob(i,"n",e.target.value)}/></td>
                <td style={{padding:"0 6px 6px 0",width:100}}><input type="number" style={{...celda,width:100}} value={b.peso} onChange={e=>setBob(i,"peso",e.target.value)}/></td>
                <td style={{padding:"0 6px 6px 0",width:90}}><input style={{...celda,width:90}} value={b.iniciales} onChange={e=>setBob(i,"iniciales",e.target.value)}/></td>
                <td style={{padding:"0 6px 6px 0",width:130}}>
                  <div style={{display:"flex",gap:4}}>
                    {[["BIEN",GN],["MAL",RE]].map(([v,c])=>(
                      <button key={v} onClick={()=>setBob(i,"estado",v)} style={{...Btn(b.estado===v?c:"transparent",b.estado===v?D:GR,{flex:1,fontSize:10,padding:"7px 4px"})}}>{v}</button>))}
                  </div>
                </td>
                <td style={{padding:"0 6px 6px 0"}}><input style={celda} value={b.defecto} onChange={e=>setBob(i,"defecto",e.target.value)} placeholder={b.estado==="MAL"?"arrugas, fuelle...":""}/></td>
                <td style={{padding:"0 0 6px 0",width:34}}>
                  <button onClick={()=>quitar(i)} style={{...Btn("transparent",RE,{padding:"7px 9px",fontSize:11,borderColor:RE+"44"})}}>✕</button>
                </td>
              </tr>))}
            </tbody>
          </table>
        </div>
      )}

      <button onClick={agregar} style={{...Btn("transparent",O,{marginTop:10,fontSize:12,padding:"8px 14px",borderColor:O})}}>+ Agregar bobina</button>
    </div>

    {msg&&<div style={{marginBottom:14,padding:12,borderRadius:8,fontSize:12,lineHeight:1.6,
        background:(msg.tipo==="ok"?GN:RE)+"15",color:msg.tipo==="ok"?GN:RE}}>
      {msg.texto}
      {msg.adv&&msg.adv.length>0&&<div style={{color:O,marginTop:6}}>
        {msg.adv.map((a,i)=><div key={i}>⚠️ {a}</div>)}
      </div>}
    </div>}

    <button onClick={guardar} disabled={!valido||guardando}
      style={{...Btn(O,D,{width:"100%",padding:"13px",fontSize:14,opacity:valido&&!guardando?1:0.5})}}>
      {guardando?"Guardando...":"Guardar hoja de control"}
    </button>
    {!valido&&<div style={{color:GR,fontSize:11,marginTop:8,textAlign:"center"}}>
      Falta elegir máquina y cargar al menos una bobina con número y peso.
    </div>}
  </div>);
}

// ── Producción (gráficos) ────────────────────────────────────────────────────
function Grafico({titulo,tipo,datos,opciones}){
  const ref=useRef(null);const chartRef=useRef(null);
  useEffect(()=>{
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current=new Chart(ref.current,{type:tipo,data:datos,options:Object.assign({
      responsive:true,
      plugins:{legend:{labels:{color:GR}}},
      scales: tipo==="doughnut"?{}:{ x:{ticks:{color:GR},grid:{color:BR}}, y:{ticks:{color:GR},grid:{color:BR}} }
    },opciones||{})});
    return ()=>chartRef.current&&chartRef.current.destroy();
  },[JSON.stringify(datos)]);
  return(<div style={{background:CA,border:"1px solid "+BR,borderRadius:12,padding:16}}>
    <h3 style={{color:GR,fontSize:12,marginBottom:10,fontWeight:700}}>{titulo}</h3>
    <div style={{maxHeight:260}}><canvas ref={ref}/></div>
  </div>);
}

function Produccion(){
  const [bobinas,setBobinas]=useState([]);const [producciones,setProducciones]=useState([]);
  const [desde,setDesde]=useState(haceDiasIso(30));const [hasta,setHasta]=useState(hoyIso());
  const [cargando,setCargando]=useState(true);

  const cargar=async()=>{
    setCargando(true);
    const {bobinas,producciones}=await db.loadProduccion(desde,hasta);
    setBobinas(bobinas);setProducciones(producciones);setCargando(false);
  };
  useEffect(()=>{cargar();},[desde,hasta]);

  const kilos=bobinas.reduce((a,b)=>a+(+b.peso||0),0);
  const bien=bobinas.filter(b=>b.estado==="BIEN").length;
  const mal=bobinas.filter(b=>b.estado==="MAL").length;
  const se=producciones.reduce((a,x)=>a+(+x.scrap_empalme||0),0);
  const sr=producciones.reduce((a,x)=>a+(+x.scrap_rollo||0),0);
  const scrapPct=kilos?(100*(se+sr)/kilos).toFixed(2)+"%":"—";

  const agrupar=(arr,clave,valor)=>{const o={};for(const x of arr){const k=x[clave]||"S/D";o[k]=(o[k]||0)+valor(x);}return o;};
  const cortarFecha=s=>s.slice(5).split("-").reverse().join("/");

  const porDia=agrupar(bobinas,"fecha",b=>+b.peso||0);const dias=Object.keys(porDia).sort();
  const opBien=agrupar(bobinas.filter(b=>b.estado==="BIEN"),"operario_bobina",()=>1);
  const opMal=agrupar(bobinas.filter(b=>b.estado==="MAL"),"operario_bobina",()=>1);
  const ops=[...new Set([...Object.keys(opBien),...Object.keys(opMal)])].sort();
  const porMaquina=agrupar(bobinas,"maquina",b=>+b.peso||0);
  const defectosCnt={};
  for(const b of bobinas){ if(!b.defectos) continue; for(const d of String(b.defectos).split(",").map(s=>s.trim().toLowerCase()).filter(Boolean)) defectosCnt[d]=(defectosCnt[d]||0)+1; }
  const defs=Object.entries(defectosCnt).sort((a,b)=>b[1]-a[1]).slice(0,8);

  return(<div>
    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"flex-end"}}>
      <div><div style={{color:GR,fontSize:10,marginBottom:4}}>DESDE</div><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...inp,width:150,fontSize:12,padding:"7px 10px"}}/></div>
      <div><div style={{color:GR,fontSize:10,marginBottom:4}}>HASTA</div><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...inp,width:150,fontSize:12,padding:"7px 10px"}}/></div>
    </div>
    {cargando?<p style={{color:GR,fontSize:12}}>Cargando...</p>:(
    bobinas.length===0?(
      <div style={{textAlign:"center",padding:40,color:GR,background:CA,border:"1px solid "+BR,borderRadius:12}}>
        <p>No hay datos de producción en este rango.<br/>Cargá una hoja desde la pestaña <strong style={{color:O}}>📝 Cargar hoja</strong>, o mandá una foto por Telegram si ya conectaste n8n.</p>
      </div>
    ):(<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:20}}>
        <StatCard v={fnum(kilos)} l="Kilos" s="del período" c={O}/>
        <StatCard v={bobinas.length} l="Bobinas" s="del período" c={W}/>
        <StatCard v={<span><span style={{color:GN}}>{bien}</span> / <span style={{color:RE}}>{mal}</span></span>} l="Bien / Mal" s="bobinas" c={W}/>
        <StatCard v={fnum(se+sr)} l="Scrap (kg)" s={scrapPct} c={BL}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14}}>
        <Grafico titulo="Kilos por día" tipo="bar" datos={{labels:dias.map(cortarFecha),datasets:[{label:"Kilos",data:dias.map(d=>porDia[d]),backgroundColor:O}]}} opciones={{plugins:{legend:{display:false}}}}/>
        <Grafico titulo="Kilos por máquina" tipo="bar" datos={{labels:Object.keys(porMaquina).sort(),datasets:[{label:"Kilos",data:Object.keys(porMaquina).sort().map(m=>porMaquina[m]),backgroundColor:PU}]}} opciones={{plugins:{legend:{display:false}}}}/>
        <Grafico titulo="BIEN / MAL por operario" tipo="bar" datos={{labels:ops,datasets:[{label:"BIEN",data:ops.map(o=>opBien[o]||0),backgroundColor:GN},{label:"MAL",data:ops.map(o=>opMal[o]||0),backgroundColor:RE}]}} opciones={{scales:{x:{stacked:true,ticks:{color:GR},grid:{color:BR}},y:{stacked:true,ticks:{color:GR},grid:{color:BR}}}}}/>
        {defs.length>0&&<Grafico titulo="Defectos más frecuentes" tipo="doughnut" datos={{labels:defs.map(d=>d[0]),datasets:[{data:defs.map(d=>d[1]),backgroundColor:[RE,O,BL,PU,GN,"#fb923c","#f472b6","#94a3b8"]}]}}/>}
      </div>
    </>)
    )}
  </div>);
}

// ── App ──────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("monitoreo");
  const [maquinas,setMaquinas]=useState([]);
  const [eventos,setEventos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [perfil,setPerfil]=useState(null);
  const [modalMaquina,setModalMaquina]=useState(null);
  const [modalEvento,setModalEvento]=useState(null);
  const isMobile=useMobile();

  useEffect(()=>{
    (async()=>{
      const p=await initAuth();
      if(!p){window.location.href="index.html";return;}
      setPerfil(p);
      try{
        const data=await db.loadAll();
        setMaquinas(data.maquinas);
        setEventos(data.eventos);
      }catch(e){console.error("Error cargando datos:",e);}
      setLoading(false);
      const s=document.getElementById("splash");
      if(s){s.style.opacity="0";setTimeout(()=>s.remove(),400);}
    })();
  },[]);

  if(loading) return null;

  const activas = maquinas.filter(m=>m.activa!==false);
  const pendientes = eventos.filter(e=>!e.resuelto);
  const porTipo = t => pendientes.filter(e=>e.tipo===t).length;

  const guardarMaquina = async d => { await db.saveMaquina(d,setMaquinas); setModalMaquina(null); };
  const guardarEvento = async d => { await db.saveEvento({...d,creadoPor:perfil?.nombre||""},setEventos); setModalEvento(null); };
  const resolver = async e => await db.marcarResuelto(e.id,!e.resuelto,setEventos);
  const eliminarEvento = async e => { if(confirm("¿Eliminar este evento?"))await db.delEvento(e.id,setEventos); };

  return(
    <div style={{minHeight:"100vh",fontFamily:"Montserrat,sans-serif",background:D,color:W}}>
      <Header nombre={perfil?.nombre} tab={tab} setTab={setTab} isMobile={isMobile}/>
      <div style={{padding:isMobile?14:24,maxWidth:1100,margin:"0 auto"}}>
        {tab==="monitoreo"&&<Monitoreo perfil={perfil}/>}
        {tab==="maquinas"&&(<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:24}}>
            <StatCard v={activas.length} l="Máquinas activas" s={maquinas.length-activas.length>0?(maquinas.length-activas.length)+" fuera de servicio":"todas operativas"} c={W}/>
            <StatCard v={pendientes.length} l="Eventos pendientes" s="sin resolver" c={pendientes.length>0?O:GN}/>
            <StatCard v={porTipo("rotura")} l="Roturas" s="pendientes" c={RE}/>
            <StatCard v={porTipo("repuesto")+porTipo("insumo")} l="Repuestos/insumos" s="por comprar" c={BL}/>
          </div>
          <MaquinasGrid
            maquinas={maquinas} eventos={eventos}
            onEditar={m=>setModalMaquina({...m})}
            onNuevoEvento={m=>setModalEvento({maquinaId:m.id,tipo:"rotura",descripcion:"",fecha:hoyIso()})}
          />
          <EventosFeed eventos={eventos} maquinas={maquinas} onResolver={resolver} onEliminar={eliminarEvento}/>
        </>)}
        {tab==="cargar"&&<CargarHoja perfil={perfil} onCargado={()=>{}}/>}
        {tab==="produccion"&&<Produccion/>}
      </div>

      {modalMaquina&&<Modal title="Editar máquina" onClose={()=>setModalMaquina(null)}>
        <MaquinaForm init={modalMaquina} onSave={guardarMaquina} onClose={()=>setModalMaquina(null)}/>
      </Modal>}
      {modalEvento&&<Modal title="Nuevo evento" onClose={()=>setModalEvento(null)}>
        <EventoForm init={modalEvento} maquinas={maquinas} onSave={guardarEvento} onClose={()=>setModalEvento(null)}/>
      </Modal>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
