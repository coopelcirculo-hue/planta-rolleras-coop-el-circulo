const {useState,useEffect,useRef}=React;

function useMobile(){ const [m,setM]=useState(window.innerWidth<768); useEffect(()=>{const h=()=>setM(window.innerWidth<768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);return m; }

function Field({label,children}){return(<div style={{marginBottom:14}}><label style={{display:"block",color:GR,fontSize:11,marginBottom:5,letterSpacing:1}}>{label.toUpperCase()}</label>{children}</div>);}
function Modal({title,children,onClose}){return(<div style={{position:"fixed",inset:0,background:"#000c",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16}}><div style={{background:CB,border:"1px solid "+BR,borderRadius:16,padding:28,width:440,maxWidth:"95vw",maxHeight:"90vh",overflowY:"auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><h3 style={{color:W,fontFamily:"Orbitron,sans-serif",fontSize:15,margin:0}}>{title}</h3><button onClick={onClose} style={{background:"transparent",border:"none",color:GR,cursor:"pointer",fontSize:20}}>✕</button></div>{children}</div></div>);}

// ── Header ───────────────────────────────────────────────────────────────────
// En el celular las etiquetas se acortan y la barra scrollea en horizontal,
// así ninguna pestaña queda cortada.
const TABS=[["monitoreo","🟢","Monitoreo","Monitoreo"],
            ["reportes","📈","Reportes","Reportes"],
            ["maquinas","🔧","Máquinas y eventos","Máquinas"],
            ["cargar","📝","Cargar hoja","Cargar"],
            ["produccion","📊","Producción","Gráficos"]];

function Header({nombre,tab,setTab,isMobile}){

  return(<div style={{background:"#0c1420",borderBottom:"1px solid "+BR,flexShrink:0}}>
    <div style={{padding:isMobile?"12px 14px":"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
      <div style={{minWidth:0}}>
        <div style={{fontFamily:"Orbitron,sans-serif",fontSize:isMobile?11:13,color:O,letterSpacing:1,whiteSpace:"nowrap"}}>🏭 PLANTA ROLLERAS</div>
        <div style={{fontSize:10,color:GR,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Coop El Círculo{nombre?" · "+nombre:""}</div>
      </div>
      <button onClick={logout} style={{...Btn("transparent",RE,{padding:"7px 12px",fontSize:12,flexShrink:0})}}>🚪{isMobile?"":" Salir"}</button>
    </div>

      {TABS.map(([id,ic,largo,corto])=>(

// ── Formularios ──────────────────────────────────────────────────────────────

  return(<>
    <Field label="Código (fijo, viene de la hoja de control)"><input style={{...inp,opacity:0.6}} value={f.codigo} disabled/></Field>
    <Field label="Nombre / apodo (opcional)"><input style={inp} value={f.nombre||""} onChange={e=>s("nombre",e.target.value)} placeholder="Ej: Rolladora chica"/></Field>
    <Field label="Notas (opcional)"><textarea style={{...inp,minHeight:70,resize:"vertical"}} value={f.notas||""} onChange={e=>s("notas",e.target.value)}/></Field>
    <Field label="Estado">
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>s("activa",true)} style={{...Btn(f.activa!==false?GN:"transparent",f.activa!==false?D:GR,{flex:1}) }}>✓ Activa</button>
        <button onClick={()=>s("activa",false)} style={{...Btn(f.activa===false?RE:"transparent",f.activa===false?W:GR,{flex:1}) }}>⏸ Fuera de servicio</button>
      </div>
    </Field>
    <div style={{display:"flex",gap:10,marginTop:8}}>
      <button onClick={onClose} style={{...Btn("transparent",GR),flex:1}}>Cancelar</button>
      <button onClick={()=>onSave(f)} style={{...Btn(O,D),flex:1}}>Guardar</button>

}

// ── Stat card ────────────────────────────────────────────────────────────────

// ── Máquinas (grid) ──────────────────────────────────────────────────────────
function MaquinasGrid({maquinas,eventos,onEditar,onNuevoEvento}){
  const pendPorMaquina = id => eventos.filter(e=>e.maquinaId===id&&!e.resuelto).length;
  return(<div>
    <h3 style={{color:W,fontSize:13,marginBottom:12,fontWeight:700}}>🏭 Máquinas</h3>
    {maquinas.length===0?(
      <div style={{textAlign:"center",padding:40,color:GR,background:CA,border:"1px solid "+BR,borderRadius:12}}>
        <div style={{fontSize:36,marginBottom:10}}>🏭</div>
        <p>Todavía no hay máquinas cargadas. Aparecen solas la primera vez que se sube una hoja de control con esa máquina.</p>
      </div>
    ):(
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
        {maquinas.map(m=>{
          const pend=pendPorMaquina(m.id);
          return(<div key={m.id} style={{background:CA,border:"1px solid "+(m.activa===false?RE+"44":(pend>0?O+"44":BR)),borderRadius:12,padding:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
              <div>
                <div style={{color:W,fontWeight:700,fontSize:13}}>Máquina {m.codigo}</div>
                {m.nombre&&<div style={{color:GR,fontSize:10,marginTop:2}}>{m.nombre}</div>}
              </div>
              <button onClick={()=>onEditar(m)} style={{...Btn("transparent",GR,{padding:"3px 7px",fontSize:11})}}>✏️</button>
            </div>
            {m.activa===false&&<span style={{background:RE+"22",color:RE,fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:20}}>FUERA DE SERVICIO</span>}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
              <span style={{fontSize:11,color:pend>0?O:GN,fontWeight:700}}>{pend>0?pend+" pendiente"+(pend!==1?"s":""):"✓ sin pendientes"}</span>
              <button onClick={()=>onNuevoEvento(m)} style={{...Btn("transparent",O,{padding:"5px 10px",fontSize:11,borderColor:O})}}>+ Evento</button>
            </div>
          </div>);
        })}
      </div>
    )}
  </div>);
}

// ── Eventos (feed) ───────────────────────────────────────────────────────────
function EventosFeed({eventos,maquinas,onResolver,onEliminar}){
  const [filtroEstado,setFiltroEstado]=useState("pendientes");
  const [filtroTipo,setFiltroTipo]=useState("todos");
  const nombreMaquina = id => { const m=maquinas.find(x=>x.id===id); return m ? tituloMaquina(m.codigo)+(m.nombre?" — "+m.nombre:"") : "—"; };

  const fil = eventos.filter(e=>{
    if(filtroEstado==="pendientes"&&e.resuelto) return false;
    if(filtroEstado==="resueltos"&&!e.resuelto) return false;
    if(filtroTipo!=="todos"&&e.tipo!==filtroTipo) return false;
    return true;
  });

  return(<div style={{marginTop:24}}>
    <h3 style={{color:W,fontSize:13,marginBottom:12,fontWeight:700}}>📋 Historial de eventos</h3>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
      {[["pendientes","Pendientes"],["resueltos","Resueltos"],["todos","Todos"]].map(([id,lbl])=>(
        <button key={id} onClick={()=>setFiltroEstado(id)} style={{...Btn(filtroEstado===id?O:"transparent",filtroEstado===id?D:GR,{padding:"5px 12px",fontSize:11})}}>{lbl}</button>
      ))}
      <span style={{width:1,background:BR,margin:"0 4px"}}/>
      <button onClick={()=>setFiltroTipo("todos")} style={{...Btn(filtroTipo==="todos"?W:"transparent",filtroTipo==="todos"?D:GR,{padding:"5px 12px",fontSize:11})}}>Todos los tipos</button>
      {TIPOS_EVENTO.map(t=>(
        <button key={t.id} onClick={()=>setFiltroTipo(t.id)} style={{...Btn(filtroTipo===t.id?t.color:"transparent",filtroTipo===t.id?D:GR,{padding:"5px 12px",fontSize:11})}}>{t.icon} {t.label}</button>
      ))}
    </div>
    {fil.length===0?(
      <p style={{color:GR,fontSize:12,textAlign:"center",padding:20}}>No hay eventos en este filtro.</p>
    ):(
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {fil.map(e=>{
          const t=tipoInfo(e.tipo);
          return(<div key={e.id} style={{background:CA,border:"1px solid "+BR,borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:200}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                <span style={{background:t.color+"22",color:t.color,fontSize:10,fontWeight:700,padding:"2px 9px",borderRadius:20}}>{t.icon} {t.label}</span>
                <span style={{color:W,fontWeight:700,fontSize:12}}>{nombreMaquina(e.maquinaId)}</span>
                <span style={{color:GR,fontSize:11}}>{fdate(e.fecha)}</span>
              </div>
              <div style={{color:GR,fontSize:12}}>{e.descripcion}</div>
              {e.resuelto&&<div style={{color:GN,fontSize:10,marginTop:4}}>✓ Resuelto {e.resueltoFecha?"el "+fdate(e.resueltoFecha):""}</div>}
              {e.creadoPor&&<div style={{color:GR,fontSize:10,marginTop:4}}>Cargado por {e.creadoPor}</div>}
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <button onClick={()=>onResolver(e)} style={{...Btn(e.resuelto?"transparent":GN,e.resuelto?GR:D,{padding:"6px 10px",fontSize:11})}}>{e.resuelto?"↺ Reabrir":"✓ Resolver"}</button>
              <button onClick={()=>onEliminar(e)} style={{...Btn("transparent",RE,{padding:"6px 10px",fontSize:11,borderColor:RE+"55"})}}>✕</button>
            </div>
          </div>);
        })}
      </div>
    )}
  </div>);
}

// ── Monitoreo en vivo ────────────────────────────────────────────────────────
function duracion(desde,hasta){
  const min=Math.max(0,Math.floor(((hasta?new Date(hasta):new Date())-new Date(desde))/60000));
  if(min<60) return min+" min";
  const h=Math.floor(min/60),m=min%60;
  if(h<24) return h+" h"+(m?" "+m+"m":"");
  const d=Math.floor(h/24);
  return d+" d"+(h%24?" "+(h%24)+"h":"");
}

  return(<div style={{background:CA,border:"1px solid "+(sinRegistro?BR:color+"66"),borderRadius:14,padding:16,display:"flex",flexDirection:"column",gap:10}}>

      <div>
        <div style={{color:W,fontWeight:700,fontSize:15}}>{tituloMaquina(fila.maquina)}</div>
        {fila.maquina_nombre&&<div style={{color:GR,fontSize:10,marginTop:2}}>{fila.maquina_nombre}</div>}
      </div>
      <span style={{background:(sinRegistro?GR:color)+"22",color:sinRegistro?GR:color,fontSize:10,fontWeight:700,padding:"4px 10px",borderRadius:20,whiteSpace:"nowrap"}}>
        {sinRegistro?"SIN REGISTRO":info.icon+" "+info.label.toUpperCase()}

    {sinRegistro?(
      <div style={{color:GR,fontSize:12,padding:"8px 0"}}>Todavía no se registró qué está haciendo.</div>

        {fila.presentacion&&<div style={{color:W,fontSize:13,marginTop:3}}>{fila.presentacion}</div>}

// ── Rollos del turno ─────────────────────────────────────────────────────────
// Se cargan a mano al terminar el turno: bultos × rollos por bulto.
function RollosForm({maquinas,init,onSave,onClose}){
  const [f,setF]=useState(init);const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const [guardando,setGuardando]=useState(false);
  const sugerido=rollosPorBulto(f.medida);
  const rpb=f.rpb!==""?Number(f.rpb):(sugerido||0);
  const rollos=(Number(f.bultos)||0)*rpb;
  // Bolsas por rollo: el tercer número de la medida (45x60x20x24 → 20).
  const sugeridoB=bolsasPorRollo(f.medida);
  const bpr=f.bpr!==""&&f.bpr!=null?Number(f.bpr):(sugeridoB||0);
  const bolsas=rollos*bpr;
  const valido=f.maquinaId&&f.fecha&&f.turno&&Number(f.bultos)>0&&rpb>0&&bpr>0;
  const guardar=async()=>{ setGuardando(true); await onSave({...f,rollosPorBulto:rpb,rollos,bolsasPorRollo:bpr,bolsas}); setGuardando(false); };
  const elegirMaquina=id=>{
    const m=maquinas.find(x=>x.maquina_id===id);
    setF(x=>({...x,maquinaId:id,medida:x.medida||(m&&m.medida)||""}));
  };
  return(<>
    <Field label="Rollera">
      <select style={inp} value={f.maquinaId} onChange={e=>elegirMaquina(e.target.value)}>
        <option value="">Elegir...</option>
        {maquinas.map(m=><option key={m.maquina_id} value={m.maquina_id}>{tituloMaquina(m.maquina)}</option>)}
      </select>
    </Field>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Fecha"><input type="date" style={inp} value={f.fecha} onChange={e=>s("fecha",e.target.value)}/></Field>
      <Field label="Turno">
        <div style={{display:"flex",gap:6}}>

function RollosTurno({maquinas,perfil}){
  const [lista,setLista]=useState(undefined);   // undefined = cargando, null = falta el SQL
  const [form,setForm]=useState(null);
  const [error,setError]=useState("");

  const cargar=async()=>setLista(await dbRollos.listar(haceDiasIso(7),hoyIso()));
  useEffect(()=>{ cargar(); },[]);

  const nuevo=()=>{
    const h=new Date().getHours();
    const enMarcha=maquinas.find(m=>m.estado==="produciendo");
    setForm({maquinaId:enMarcha?.maquina_id||"",fecha:hoyIso(),turno:h>=6&&h<18?"dia":"noche",
             medida:enMarcha?.medida||"",bultos:"",rpb:"",bpr:""});
  };
  const guardar=async f=>{
    const r=await dbRollos.guardar({...f,creadoPor:perfil?.nombre||""});
    if(!r.ok){ setError(r.detalle); return; }
    setError(""); setForm(null); await cargar();
  };
  const borrar=async r=>{
    if(!confirm("¿Borrar los "+fnum(r.rollos)+" rollos de "+tituloMaquina(r.maquina)+" del "+fdate(r.fecha)+"?"))return;
    const x=await dbRollos.borrar(r.id);
    if(!x.ok){ setError(x.detalle); return; }
    setError(""); await cargar();
  };

  const filas=lista||[];
  // Los millares son de bolsas (unidades), como se cuentan en la planta.
  const total=filas.reduce((a,r)=>a+bolsasDe(r),0);
  const totalRollos=filas.reduce((a,r)=>a+(+r.rollos||0),0);
  const porMaquina={};
  filas.forEach(r=>{ porMaquina[r.maquina]=(porMaquina[r.maquina]||0)+bolsasDe(r); });

  return(<div style={{marginTop:24}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:10,flexWrap:"wrap"}}>
      <h3 style={{color:W,fontSize:13,margin:0,fontWeight:700}}>📦 Rollos por turno</h3>
      <button onClick={nuevo} disabled={lista===null} style={{...Btn(O,D,{fontSize:12,padding:"7px 14px",opacity:lista===null?0.5:1})}}>+ Cargar rollos del turno</button>
    </div>

    {error&&<div style={{color:RE,fontSize:12,marginBottom:12,padding:10,background:RE+"15",borderRadius:8}}>{error}</div>}

    {lista===undefined?<p style={{color:GR,fontSize:12}}>Cargando...</p>:
     lista===null?<div style={{color:O,fontSize:12,padding:12,background:O+"15",borderRadius:8}}>Falta correr el SQL 16 en Supabase para poder cargar rollos.</div>:(
     <div style={{background:CA,border:"1px solid "+BR,borderRadius:14,padding:16}}>
      <div style={{display:"flex",gap:18,flexWrap:"wrap",alignItems:"baseline",marginBottom:filas.length?12:0}}>
        <div>
          <div style={{color:GR,fontSize:10,letterSpacing:1}}>ÚLTIMOS 7 DÍAS</div>
          <div style={{color:GN,fontWeight:700,fontSize:22}}>{millares(total)} <span style={{fontSize:12,color:GR,fontWeight:400}}>millares de bolsas · {fnum(totalRollos)} rollos</span></div>
        </div>
        {Object.entries(porMaquina).sort().map(([m,n])=>(
          <div key={m}>
            <div style={{color:GR,fontSize:10,letterSpacing:1}}>{tituloMaquina(m).toUpperCase()}</div>
            <div style={{color:W,fontWeight:700,fontSize:15}}>{millares(n)} <span style={{fontSize:11,color:GR,fontWeight:400}}>millares</span></div>
          </div>
        ))}
      </div>
      {filas.length===0?<p style={{color:GR,fontSize:12,margin:0}}>Todavía no se cargaron rollos esta semana.</p>:
       <div style={{display:"flex",flexDirection:"column"}}>
        {filas.map((r,i)=>(
          <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,fontSize:12,padding:"8px 0",borderTop:"1px solid "+BR}}>
            <div style={{flex:1,minWidth:0}}>
              <span style={{color:W,fontWeight:600}}>{tituloMaquina(r.maquina)}</span>
              <span style={{color:GR}}> · {fdate(r.fecha)} · {r.turno}{r.medida?" · "+r.medida:""}</span>
            </div>
            <span style={{color:GR,whiteSpace:"nowrap"}}>{r.bultos} × {r.rollos_por_bulto} × {r.bolsas_por_rollo||bolsasPorRollo(r.medida)||"?"}</span>
            <span style={{color:GN,fontWeight:700,whiteSpace:"nowrap",minWidth:80,textAlign:"right"}}>{millares(bolsasDe(r))} mill.</span>
            <button onClick={()=>borrar(r)} title="Borrar" style={{...Btn("transparent",RE,{fontSize:11,padding:"4px 9px",borderColor:RE+"55"})}}>✕</button>
          </div>

     </div>)}

    {form&&<Modal title="Rollos del turno" onClose={()=>{setForm(null);setError("");}}>

    </Modal>}
  </div>);
}

  const abrirCambio = f => setModal({

      <button onClick={()=>setNuevaMaq(true)} style={{...Btn(O,D,{fontSize:12,padding:"7px 14px"})}}>+ Agregar máquina</button>
    </div>

    {filas.length===0?(

      {historial.filas===null?<p style={{color:GR,fontSize:12}}>Cargando...</p>:

// ── Resultado de una carga, en palabras ──────────────────────────────────────
// "ya_cargada" es lo que antes se veía como "no apareció ningún parte": la foto
// era de una hoja que ya estaba, y por eso no hay que volver a subirla.
function mensajeCarga(d){
  const h=d.hoja;
  const desc=h?tituloMaquina(h.maquina)+" · "+fdate(h.fecha)+" · "+h.turno+" · "+h.bobinas+" bobinas · "+fnum(h.kilos)+" kg":"";
  if(d.resultado==="fallida")
    return {tipo:"error",texto:"✗ No se pudo leer la hoja: "+(d.motivo||"error desconocido")+
      "\nProbá sacar la foto de nuevo, derecha y con buena luz, o cargala a mano acá abajo."};
  if(d.resultado==="posible_repetida")
    return {tipo:"aviso",texto:"⚠️ Cargada, pero se parece a otra hoja ya cargada: "+desc+
      "\nQuedó marcada en Reportes para revisar. No hace falta volver a subirla."};
  if(d.resultado==="ya_cargada")
    return {tipo:"info",texto:"ℹ️ Esta hoja ya estaba cargada, no se agregó nada: "+desc+
      ((d.advertencias||[]).length?"\n"+d.advertencias.join(" | "):"")};
  const obs=h?.observaciones||"";
  const revisar=obs.includes("⚠ REVISAR:");
  return {tipo:revisar?"aviso":"ok",
    texto:(revisar?"⚠️ Cargada, pero revisala: ":"✓ Hoja cargada: ")+desc+(revisar?"\n"+obs.split("⚠ REVISAR:")[1].trim():"")};
}

// ── Últimas cargas: qué pasó con cada foto subida ────────────────────────────
function UltimasCargas({version}){
  const [lista,setLista]=useState(null);
  useEffect(()=>{
    let vivo=true;
    (async()=>{ const l=await db.cargasRecientes(12); if(vivo) setLista(l); })();
    return ()=>{ vivo=false; };
  },[version]);
  if(!lista||lista.length===0) return null;

  const TIPOS={
    nueva:["✓",GN,"Cargada"],
    nueva_mismo_turno:["⚠️",O,"Cargada · hay otra hoja del mismo turno con otro operario"],
    posible_repetida:["⚠️",O,"Cargada · se parece a otra hoja"],
    ya_cargada:["ℹ️",BL,"Ya estaba cargada (sistema anterior)"],
    fallida:["✗",RE,"No se pudo leer"],
    sumada:["⚠️",O,"Se sumó a otra hoja (sistema anterior)"],
  };
  return(<div style={{marginTop:16,borderTop:"1px solid "+BR,paddingTop:12}}>
    <div style={{color:GR,fontSize:10,letterSpacing:1,marginBottom:8}}>ÚLTIMAS CARGAS</div>
    {lista.map((c,i)=>{
      const r=c.resultado||((c.advertencias||[]).some(a=>String(a).startsWith("Ya existia"))?"sumada":"nueva");
      const [icono,color,etiqueta]=TIPOS[r]||["•",GR,r];
      const h=c.hoja;
      // Cómo está AHORA (el renglón muestra cómo quedó al subirla): la hoja se
      // lee en vivo, así que si alguien la corrigió o la borró, se nota acá.
      const obs=h?.observaciones||"";
      const ahora = r==="fallida"
          ? (lista.some(x=>c.ejecucion&&x.carga_id==="reenvio-"+c.ejecucion&&x.resultado!=="fallida")
              ? ["✓ Ya se volvió a cargar",GN] : ["Todavía no está cargada: volvé a subir la foto",O])
        : !h ? ["La hoja se borró después (era repetida)",GR]
        : r!=="nueva" ? (obs.includes("⚠ REVISAR") ? ["Todavía hay que revisarla en Reportes",O] : ["✓ Ya se corrigió",GN])
        : null;
      return(<div key={i} style={{display:"flex",gap:8,fontSize:11,padding:"7px 0",lineHeight:1.5,
          borderBottom:i<lista.length-1?"1px solid "+BR+"66":"none"}}>
        <span style={{color,width:18,flexShrink:0}}>{icono}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{color:W}}>
            <span style={{color,fontWeight:700}}>{etiqueta}</span>
            {h?" · "+tituloMaquina(h.maquina)+" · "+fdate(h.fecha)+" · "+h.turno+" · "+h.bobinas+" bob. · "+fnum(h.kilos)+" kg"
              :(c.rollera?" · "+tituloMaquina(c.rollera):"")}
          </div>
          {r==="fallida"&&c.motivo&&<div style={{color:GR}}>{c.motivo}</div>}
          {ahora&&<div style={{color:ahora[1],fontWeight:600}}>Ahora: {ahora[0]}</div>}
        </div>
        <span style={{color:GR,whiteSpace:"nowrap",flexShrink:0}}>{fhora(c.momento)}</span>
      </div>);
    })}
  </div>);
}

// ── Subir la foto de la hoja (la procesa n8n con IA) ─────────────────────────
function SubirFoto({maquinas,onListo}){
  const [archivo,setArchivo]=useState(null);
  const [maquina,setMaquina]=useState("");
  // Normalmente la fecha y el turno los lee la IA de la hoja. Estos campos son
  // solo para forzarlos cuando la letra está tan mal que no hay forma.
  const [fecha,setFecha]=useState("");
  const [turno,setTurno]=useState("");
  const [estado,setEstado]=useState(null); // {tipo, texto}
  // Dos inputs: uno abre la cámara (solo celular/tablet), el otro el explorador.
  const refCamara=useRef(null);
  const refInput=useRef(null);

  const elegir=e=>{ const f=e.target.files?.[0]; if(f){ setArchivo(f); setEstado(null); } };

  // Cambia cada vez que termina una carga, para refrescar "Últimas cargas".
  const [version,setVersion]=useState(0);

  const enviar=async()=>{
    if(!archivo) return;
    setEstado({tipo:"proceso",texto:"Subiendo la foto..."});
    // Código único de esta foto: con él se pregunta después qué pasó con ELLA,
    // en vez de adivinar mirando si apareció alguna hoja nueva.
    const cargaId="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const antes=await db.idsDePartes();

    const r=await db.subirFoto(archivo,maquina,fecha,turno,cargaId);
    if(!r.ok){ setEstado({tipo:"error",texto:r.detalle}); return; }

    setEstado({tipo:"proceso",texto:"Leyendo la hoja con IA... Si la IA está saturada puede tardar un par de minutos. No la vuelvas a subir."});
    const terminar=(msg,limpiar)=>{
      setEstado(msg);
      setVersion(v=>v+1);
      if(limpiar){
        setArchivo(null); setFecha(""); setTurno("");
        if(refInput.current) refInput.current.value="";
        if(refCamara.current) refCamara.current.value="";
        if(onListo) onListo();
      }
    };
    for(let i=0;i<60;i++){   // hasta 4 minutos
      await new Promise(res=>setTimeout(res,4000));
      const e=await db.estadoCarga(cargaId);
      if(e.sinSoporte){
        // La base todavía no registra las cargas: se usa el método anterior.
        const ahora=await db.idsDePartes();
        const nuevo=[...ahora].find(id=>!antes.has(id));
        if(nuevo){ const p=await db.parteporId(nuevo); terminar(mensajeCarga({resultado:"nueva",hoja:p}),true); return; }
        continue;
      }
      if(e.dato){ terminar(mensajeCarga(e.dato), e.dato.resultado!=="fallida"); return; }
    }
    terminar({tipo:"aviso",texto:"Sigue procesando. NO la vuelvas a subir: el resultado va a aparecer en \"Últimas cargas\" en unos minutos."},false);
  };

  const procesando = estado?.tipo==="proceso";
  const colorEstado = estado?.tipo==="ok"?GN : estado?.tipo==="error"?RE : estado?.tipo==="info"?BL : O;
  // El mensaje puede traer el motivo de revisión en una segunda línea.
  const lineas = (estado?.texto||"").split("\n");

  return(<div style={{background:CA,border:"1px solid "+O+"55",borderRadius:12,padding:16,marginBottom:20}}>
    <h3 style={{color:W,fontSize:13,marginBottom:4,fontWeight:700}}>📷 Subir foto de la hoja</h3>
    <p style={{color:GR,fontSize:11,marginBottom:14,lineHeight:1.5}}>
      Sacá la foto de la hoja de control y la IA la lee sola. Es lo mismo que mandarla
      por el formulario, pero sin salir de la app.
    </p>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:12}}>
      <div>
        <div style={{color:GR,fontSize:10,letterSpacing:1,marginBottom:5}}>FOTO DE LA HOJA</div>
        <input ref={refCamara} type="file" accept="image/*" capture="environment" onChange={elegir} style={{display:"none"}}/>
        <input ref={refInput} type="file" accept="image/*" onChange={elegir} style={{display:"none"}}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>refCamara.current?.click()} style={{...Btn("transparent",O,{flex:1,fontSize:12,padding:"10px 8px",borderColor:O})}}>📷 Sacar foto</button>
          <button onClick={()=>refInput.current?.click()} style={{...Btn("transparent",GR,{flex:1,fontSize:12,padding:"10px 8px"})}}>🖼️ Elegir archivo</button>
        </div>
      </div>
      <div>
        <div style={{color:GR,fontSize:10,letterSpacing:1,marginBottom:5}}>ROLLERA QUE CORTÓ</div>
        <select style={inp} value={maquina} onChange={e=>setMaquina(e.target.value)}>
          <option value="">Elegir...</option>
          {maquinas.map(m=><option key={m.id} value={m.codigo}>{tituloMaquina(m.codigo)}</option>)}
        </select>
      </div>
    </div>

    <details style={{marginBottom:12}}>
      <summary style={{color:GR,fontSize:11,cursor:"pointer"}}>
        ¿La letra está muy fea? Forzar fecha y turno a mano
      </summary>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginTop:10}}>
        <div>

// ── Producción (gráficos) ────────────────────────────────────────────────────
function Grafico({titulo,tipo,datos,opciones}){
  const ref=useRef(null);const chartRef=useRef(null);
  useEffect(()=>{
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current=new Chart(ref.current,{type:tipo,data:datos,options:Object.assign({
      responsive:true,
      plugins:{legend:{labels:{color:GR}}},
      scales: tipo==="doughnut"?{}:{ x:{ticks:{color:GR},grid:{color:BR}}, y:{ticks:{color:GR},grid:{color:BR}} }
    },opciones||{})});
    return ()=>chartRef.current&&chartRef.current.destroy();
  },[JSON.stringify(datos)]);
  return(<div style={{background:CA,border:"1px solid "+BR,borderRadius:12,padding:16}}>
    <h3 style={{color:GR,fontSize:12,marginBottom:10,fontWeight:700}}>{titulo}</h3>
    <div style={{maxHeight:260}}><canvas ref={ref}/></div>
  </div>);
}

function Produccion(){
  const [bobinas,setBobinas]=useState([]);const [producciones,setProducciones]=useState([]);
  const [desde,setDesde]=useState(haceDiasIso(30));const [hasta,setHasta]=useState(hoyIso());
  const [cargando,setCargando]=useState(true);

  const cargar=async()=>{
    setCargando(true);
    const {bobinas,producciones}=await db.loadProduccion(desde,hasta);
    setBobinas(bobinas);setProducciones(producciones);setCargando(false);
  };
  useEffect(()=>{cargar();},[desde,hasta]);

  const kilos=bobinas.reduce((a,b)=>a+(+b.peso||0),0);
  const bien=bobinas.filter(b=>b.estado==="BIEN").length;
  const mal=bobinas.filter(b=>b.estado==="MAL").length;
  const se=producciones.reduce((a,x)=>a+(+x.scrap_empalme||0),0);
  const sr=producciones.reduce((a,x)=>a+(+x.scrap_rollo||0),0);
  const scrapPct=kilos?(100*(se+sr)/kilos).toFixed(2)+"%":"—";

  const agrupar=(arr,clave,valor)=>{const o={};for(const x of arr){const k=x[clave]||"S/D";o[k]=(o[k]||0)+valor(x);}return o;};
  const cortarFecha=s=>s.slice(5).split("-").reverse().join("/");

  const porDia=agrupar(bobinas,"fecha",b=>+b.peso||0);const dias=Object.keys(porDia).sort();
  const opBien=agrupar(bobinas.filter(b=>b.estado==="BIEN"),"operario_bobina",()=>1);
  const opMal=agrupar(bobinas.filter(b=>b.estado==="MAL"),"operario_bobina",()=>1);
  const ops=[...new Set([...Object.keys(opBien),...Object.keys(opMal)])].sort();
  const porMaquina=agrupar(bobinas,"maquina",b=>+b.peso||0);
  const defectosCnt={};
  for(const b of bobinas){ if(!b.defectos) continue; for(const d of String(b.defectos).split(",").map(s=>s.trim().toLowerCase()).filter(Boolean)) defectosCnt[d]=(defectosCnt[d]||0)+1; }
  const defs=Object.entries(defectosCnt).sort((a,b)=>b[1]-a[1]).slice(0,8);

  return(<div>
    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"flex-end"}}>
      <div><div style={{color:GR,fontSize:10,marginBottom:4}}>DESDE</div><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...inp,width:150,fontSize:12,padding:"7px 10px"}}/></div>
      <div><div style={{color:GR,fontSize:10,marginBottom:4}}>HASTA</div><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...inp,width:150,fontSize:12,padding:"7px 10px"}}/></div>
    </div>
    {cargando?<p style={{color:GR,fontSize:12}}>Cargando...</p>:(
    bobinas.length===0?(
      <div style={{textAlign:"center",padding:40,color:GR,background:CA,border:"1px solid "+BR,borderRadius:12}}>
        <p>No hay datos de producción en este rango.<br/>Cargá una hoja desde la pestaña <strong style={{color:O}}>📝 Cargar hoja</strong>, o mandá una foto por Telegram si ya conectaste n8n.</p>
      </div>
    ):(<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:20}}>
        <StatCard v={fnum(kilos)} l="Kilos" s="del período" c={O}/>
        <StatCard v={bobinas.length} l="Bobinas" s="del período" c={W}/>
        <StatCard v={<span><span style={{color:GN}}>{bien}</span> / <span style={{color:RE}}>{mal}</span></span>} l="Bien / Mal" s="bobinas" c={W}/>
        <StatCard v={fnum(se+sr)} l="Scrap (kg)" s={scrapPct} c={BL}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14}}>
        <Grafico titulo="Kilos por día" tipo="bar" datos={{labels:dias.map(cortarFecha),datasets:[{label:"Kilos",data:dias.map(d=>porDia[d]),backgroundColor:O}]}} opciones={{plugins:{legend:{display:false}}}}/>
        <Grafico titulo="Kilos por máquina" tipo="bar" datos={{labels:Object.keys(porMaquina).sort(),datasets:[{label:"Kilos",data:Object.keys(porMaquina).sort().map(m=>porMaquina[m]),backgroundColor:PU}]}} opciones={{plugins:{legend:{display:false}}}}/>
        <Grafico titulo="BIEN / MAL por operario" tipo="bar" datos={{labels:ops,datasets:[{label:"BIEN",data:ops.map(o=>opBien[o]||0),backgroundColor:GN},{label:"MAL",data:ops.map(o=>opMal[o]||0),backgroundColor:RE}]}} opciones={{scales:{x:{stacked:true,ticks:{color:GR},grid:{color:BR}},y:{stacked:true,ticks:{color:GR},grid:{color:BR}}}}}/>
        {defs.length>0&&<Grafico titulo="Defectos más frecuentes" tipo="doughnut" datos={{labels:defs.map(d=>d[0]),datasets:[{data:defs.map(d=>d[1]),backgroundColor:[RE,O,BL,PU,GN,"#fb923c","#f472b6","#94a3b8"]}]}}/>}
      </div>
    </>)
    )}
  </div>);
}

// ── Corregir una hoja cargada (cuando la IA leyó mal algo) ───────────────────
function CorregirHoja({hoja,onCerrar,onCambio}){
  const [f,setF]=useState({
    fecha:hoja.fecha, turno:hoja.turno, medida:hoja.medida||"",
    bultos:hoja.bultos??"", observaciones:hoja.observaciones||"",
    maquinaOrigen:hoja.maquina_origen||"",
    scrapEmpalme:hoja.scrap_empalme??"", scrapRollo:hoja.scrap_rollo??""
  });
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const [bobinas,setBobinas]=useState(null);
  const [msg,setMsg]=useState(null);
  const [guardando,setGuardando]=useState(false);

  const cargarBobinas=async()=>setBobinas(await db.bobinasDeHoja(hoja.id));
  useEffect(()=>{ cargarBobinas(); },[]);

  const guardarHoja=async()=>{
    setGuardando(true);
    // El scrap va en otra tabla: se guarda solo si cambió. Si lo corrigieron,
    // la nota de "scrap mal leído por la IA" ya no hace falta y se quita sola.
    const cambioScrap=String(f.scrapEmpalme)!==String(hoja.scrap_empalme??"")||String(f.scrapRollo)!==String(hoja.scrap_rollo??"");
    const datos=cambioScrap?{...f,observaciones:quitarNotaRevisar(f.observaciones,/scrap mal leido por la IA/i)}:f;
    const r=await db.actualizarHoja(hoja.id,datos);
    const r2=r.ok&&cambioScrap?await db.actualizarScrap(hoja.id,f.scrapEmpalme,f.scrapRollo):{ok:true};
    setGuardando(false);
    if(!r.ok){ setMsg({t:"error",x:r.detalle}); return; }
    if(!r2.ok){ setMsg({t:"error",x:"La hoja se guardó, pero el scrap no: "+r2.detalle}); return; }
    if(cambioScrap) s("observaciones",datos.observaciones);
    setMsg({t:"ok",x:"✓ Hoja corregida"}); onCambio();
  };

  const borrarHoja=async()=>{
    if(!confirm("¿Borrar toda la hoja? Se borran también sus "+(bobinas?bobinas.length:"")+" bobinas. No se puede deshacer."))return;
    const r=await db.borrarHoja(hoja.id);
    if(!r.ok){ setMsg({t:"error",x:r.detalle}); return; }
    onCambio(); onCerrar();
  };

  const guardarBobina=async b=>{
    const r=await db.actualizarBobina(b.id,{n:b.n_bobina,peso:b.peso,iniciales:b.operario_bobina,estado:b.estado});
    if(!r.ok){ setMsg({t:"error",x:r.detalle}); return; }
    setMsg({t:"ok",x:"✓ Bobina "+b.n_bobina+" corregida"}); onCambio();
  };

  const borrarBobina=async b=>{
    if(!confirm("¿Borrar la bobina "+b.n_bobina+"?"))return;
    const r=await db.borrarBobina(b.id);
    if(!r.ok){ setMsg({t:"error",x:r.detalle}); return; }
    await cargarBobinas(); onCambio();
  };

  const setBob=(i,k,v)=>setBobinas(prev=>prev.map((b,j)=>j===i?{...b,[k]:v}:b));
  const celda={...inp,padding:"6px 8px",fontSize:12};

  return(<>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Field label="Fecha"><input type="date" style={inp} value={f.fecha} onChange={e=>s("fecha",e.target.value)}/></Field>
      <Field label="Turno">
        <div style={{display:"flex",gap:6}}>
          {[["dia","☀️ Día"],["noche","🌙 Noche"]].map(([id,l])=>(
            <button key={id} onClick={()=>s("turno",id)} style={{...Btn(f.turno===id?O:"transparent",f.turno===id?D:GR,{flex:1,fontSize:12})}}>{l}</button>))}
        </div>
      </Field>
      <Field label="Medida"><input style={inp} value={f.medida} onChange={e=>s("medida",e.target.value)}/></Field>
      <Field label="Bultos"><input type="number" style={inp} value={f.bultos} onChange={e=>s("bultos",e.target.value)}/></Field>
      <Field label="Máquina de origen"><input style={inp} value={f.maquinaOrigen} onChange={e=>s("maquinaOrigen",e.target.value)}/></Field>
      <Field label="Scrap empalme (kg)"><input type="number" inputMode="numeric" style={inp} value={f.scrapEmpalme} onChange={e=>s("scrapEmpalme",e.target.value)}/></Field>
      <Field label="Scrap rollo (kg)"><input type="number" inputMode="numeric" style={inp} value={f.scrapRollo} onChange={e=>s("scrapRollo",e.target.value)}/></Field>
    </div>
    <Field label="Observaciones"><input style={inp} value={f.observaciones} onChange={e=>s("observaciones",e.target.value)}/></Field>

    <div style={{display:"flex",gap:8,marginBottom:16}}>
      <button onClick={guardarHoja} disabled={guardando} style={{...Btn(O,D,{flex:1,fontSize:12})}}>{guardando?"Guardando...":"Guardar cambios de la hoja"}</button>
      <button onClick={borrarHoja} style={{...Btn("transparent",RE,{fontSize:12,borderColor:RE+"66"})}}>🗑 Borrar hoja</button>
    </div>

    <div style={{color:W,fontSize:12,fontWeight:700,marginBottom:8}}>Bobinas</div>
    {bobinas===null?<p style={{color:GR,fontSize:12}}>Cargando...</p>:
     bobinas.length===0?<p style={{color:GR,fontSize:12}}>Esta hoja no tiene bobinas.</p>:
     <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:300,overflowY:"auto"}}>
      {bobinas.map((b,i)=>(<div key={b.id} style={{background:D,borderRadius:8,padding:10,
           borderLeft:"3px solid "+(b.estado==="MAL"?RE:GN)}}>
        <div style={{display:"flex",gap:6,alignItems:"flex-end",flexWrap:"wrap"}}>
          <div style={{width:76}}>
            <div style={{color:GR,fontSize:9,marginBottom:3}}>N°</div>
            <input style={celda} value={b.n_bobina||""} onChange={e=>setBob(i,"n_bobina",e.target.value)}/>
          </div>
          <div style={{width:92}}>
            <div style={{color:GR,fontSize:9,marginBottom:3}}>PESO</div>
            <input type="number" style={celda} value={b.peso??""} onChange={e=>setBob(i,"peso",e.target.value)}/>
          </div>
          <div style={{width:76}}>
            <div style={{color:GR,fontSize:9,marginBottom:3}}>INIC.</div>
            <input style={celda} value={b.operario_bobina||""} onChange={e=>setBob(i,"operario_bobina",e.target.value)}/>
          </div>
          <div style={{display:"flex",gap:4}}>
            {[["BIEN",GN],["MAL",RE]].map(([v,c])=>(
              <button key={v} onClick={()=>setBob(i,"estado",v)} style={{...Btn(b.estado===v?c:"transparent",b.estado===v?D:GR,{fontSize:10,padding:"7px 9px"})}}>{v}</button>))}
          </div>
          <button onClick={()=>guardarBobina(b)} style={{...Btn(O,D,{fontSize:11,padding:"7px 11px"})}}>Guardar</button>
          <button onClick={()=>borrarBobina(b)} style={{...Btn("transparent",RE,{fontSize:11,padding:"7px 9px",borderColor:RE+"55"})}}>✕</button>
        </div>
        {b.defectos&&<div style={{color:O,fontSize:10,marginTop:6}}>Defecto: {b.defectos}</div>}
      </div>))}
     </div>}

    {msg&&<div style={{marginTop:12,padding:10,borderRadius:8,fontSize:12,
        background:(msg.t==="ok"?GN:RE)+"15",color:msg.t==="ok"?GN:RE}}>{msg.x}</div>}
  </>);
}

// ── Reportes (semanal / trimestral) ──────────────────────────────────────────
function Barra({valor,max,color}){
  // Las clases sirven para que las barras sigan viéndose al imprimir en blanco y negro.
  return(<div className="barra-fondo" style={{flex:1,background:BR,borderRadius:4,height:8,overflow:"hidden"}}>
    <div className="barra-relleno" style={{width:Math.round((valor/(max||1))*100)+"%",background:color,height:"100%",borderRadius:4}}/>
  </div>);
}

function Reportes(){
  const [periodo,setPeriodo]=useState("semana");
  const [desde,setDesde]=useState(haceDiasIso(7));
  const [hasta,setHasta]=useState(hoyIso());
  const [todasBobinas,setTodasBobinas]=useState([]);
  const [todasProd,setTodasProd]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [buscar,setBuscar]=useState("");
  const [corrigiendo,setCorrigiendo]=useState(null);
  // "todas" o el código de una rollera: permite el reporte individual por máquina.
  const [rollera,setRollera]=useState("todas");
  // La lista de hojas muestra por defecto solo las que tienen algo para revisar.
  const [soloRevisar,setSoloRevisar]=useState(true);
  // Rollos por turno (se cargan en Monitoreo). null = falta el SQL 16.
  const [rollos,setRollos]=useState(null);


  // Los períodos que pidieron: la semana y el trimestre cerrado.
  const aplicar=p=>{
    setPeriodo(p);
    const hoy=new Date();
    if(p==="semana"){ setDesde(haceDiasIso(7)); setHasta(hoyIso()); }
    if(p==="mes"){ setDesde(haceDiasIso(30)); setHasta(hoyIso()); }
    if(p==="trimestre"){ setDesde(haceDiasIso(90)); setHasta(hoyIso()); }
  };

  // Se vuelve a consultar al cambiar el período y después de cada corrección.
  const recargar=async()=>{
    setCargando(true);
    const [d,r]=await Promise.all([db.loadProduccion(desde,hasta),dbRollos.listar(desde,hasta)]);
    setTodasBobinas(d.bobinas); setTodasProd(d.producciones); setRollos(r); setCargando(false);
  };
  useEffect(()=>{ recargar(); },[desde,hasta]);

  // El filtro por rollera se aplica sobre lo ya traído, sin volver a consultar.
  const bobinas = rollera==="todas" ? todasBobinas : todasBobinas.filter(b=>b.maquina===rollera);
  const producciones = rollera==="todas" ? todasProd : todasProd.filter(p=>p.maquina===rollera);
  const rolleras = [...new Set(todasBobinas.map(b=>b.maquina))].sort();

  const kilos=bobinas.reduce((a,b)=>a+(+b.peso||0),0);
  const mal=bobinas.filter(b=>b.estado==="MAL");
  const conEstado=bobinas.filter(b=>b.estado);
  const pctError=conEstado.length?(100*mal.length/conEstado.length).toFixed(1)+"%":"—";
  const sinEstado=bobinas.length-conEstado.length;
  const se=producciones.reduce((a,x)=>a+(+x.scrap_empalme||0),0);
  const sr=producciones.reduce((a,x)=>a+(+x.scrap_rollo||0),0);
  const pctScrap=kilos?(100*(se+sr)/kilos):0;

  // Rollos: por semana (lunes a domingo) o por mes si el período es largo.
  const rollosF=(rollos||[]).filter(r=>rollera==="todas"||r.maquina===rollera);
  const totalRollos=rollosF.reduce((a,r)=>a+(+r.rollos||0),0);
  const totalBolsas=rollosF.reduce((a,r)=>a+bolsasDe(r),0);
  const turnosRollos=new Set(rollosF.map(r=>r.maquina+"|"+r.fecha+"|"+r.turno)).size;
  const porMes=(new Date(hasta)-new Date(desde))/86400000>45;
  const clavePeriodo=f=>{
    if(porMes) return f.slice(0,7);
    const d=new Date(f+"T12:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7));
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  };
  const rollosPeriodos=Object.values(rollosF.reduce((m,r)=>{
    const k=clavePeriodo(r.fecha);
    m[k]=m[k]||{clave:k,bolsas:0,maq:{}};
    m[k].bolsas+=bolsasDe(r);
    m[k].maq[r.maquina]=(m[k].maq[r.maquina]||0)+bolsasDe(r);
    return m;
  },{})).sort((a,b)=>a.clave<b.clave?-1:1);
  const maxRollosPer=Math.max(1,...rollosPeriodos.map(p=>p.bolsas));
  const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const etiquetaPeriodo=k=>porMes?MESES[Number(k.slice(5,7))-1]+" "+k.slice(0,4):"Semana del "+fdate(k).slice(0,5);

  // Scrap por rollera y por turno: dónde y cuándo se tira más
  const scrapPorRollera=()=>{
    const m={};
    for(const p of producciones){
      const k=p.maquina||"S/D";
      if(!m[k]) m[k]={maquina:k,empalme:0,rollo:0,kilos:0,turnos:0};
      m[k].empalme+=(+p.scrap_empalme||0); m[k].rollo+=(+p.scrap_rollo||0);
      m[k].kilos+=(+p.kilos||0); m[k].turnos++;
    }
    return Object.values(m).map(x=>({...x,total:x.empalme+x.rollo,
      pct:x.kilos?100*(x.empalme+x.rollo)/x.kilos:0})).sort((a,b)=>b.total-a.total);
  };
  const scrapMaq=scrapPorRollera();

  const scrapPorTurno=()=>{
    const m={dia:{turno:"dia",total:0,kilos:0},noche:{turno:"noche",total:0,kilos:0}};
    for(const p of producciones){
      const t=m[p.turno]; if(!t) continue;
      t.total+=(+p.scrap_empalme||0)+(+p.scrap_rollo||0); t.kilos+=(+p.kilos||0);
    }
    return Object.values(m).map(x=>({...x,pct:x.kilos?100*x.total/x.kilos:0}));
  };
  const scrapTurno=scrapPorTurno();

  // Los turnos con más scrap: sirve para ir a buscar qué pasó ese día
  const peoresTurnos=[...producciones]
    .map(p=>({...p,scrap:(+p.scrap_empalme||0)+(+p.scrap_rollo||0),
              pct:p.kilos?100*((+p.scrap_empalme||0)+(+p.scrap_rollo||0))/p.kilos:0}))
    .filter(p=>p.scrap>0).sort((a,b)=>b.scrap-a.scrap).slice(0,6);

  // Operarios con más errores (y sobre cuántas bobinas hicieron)
  const porOperario=()=>{
    const m={};
    for(const b of bobinas){
      const k=b.operario_bobina||"S/D";
      if(!m[k]) m[k]={nombre:k,total:0,mal:0,kilos:0};
      m[k].total++; m[k].kilos+=(+b.peso||0);
      if(b.estado==="MAL") m[k].mal++;
    }
    return Object.values(m).sort((a,b)=>b.mal-a.mal);
  };
  const ops=porOperario();
  const maxMal=ops[0]?.mal||1;

  // Defectos más comunes
  const porDefecto=()=>{
    const m={};
    for(const b of bobinas){
      if(!b.defectos) continue;
      for(const d of String(b.defectos).split(",").map(s=>s.trim().toLowerCase()).filter(Boolean))
        m[d]=(m[d]||0)+1;
    }
    return Object.entries(m).map(([nombre,cant])=>({nombre,cant})).sort((a,b)=>b.cant-a.cant);
  };
  const defs=porDefecto();
  const maxDef=defs[0]?.cant||1;

  // Kilos por rollera (las máquinas de la planta)
  const porMaquina=()=>{
    const m={};
    for(const b of bobinas){
      const k=b.maquina||"S/D";
      if(!m[k]) m[k]={maquina:k,kilos:0,total:0,mal:0};
      m[k].kilos+=(+b.peso||0); m[k].total++;
      if(b.estado==="MAL") m[k].mal++;
    }
    return Object.values(m).sort((a,b)=>b.kilos-a.kilos);
  };
  const maqs=porMaquina();
  const maxKilos=maqs[0]?.kilos||1;

  // Trazabilidad: buscar una bobina por número
  const encontradas=buscar.trim()
    ? bobinas.filter(b=>String(b.n_bobina).toLowerCase().includes(buscar.trim().toLowerCase()))
    : [];

  const Caja=({titulo,children})=>(
    <div className="caja-reporte" style={{background:CA,border:"1px solid "+BR,borderRadius:14,padding:18}}>
      <div style={{color:W,fontWeight:700,fontSize:13,marginBottom:14}}>{titulo}</div>
      {children}
    </div>
  );

  return(<div>
    <div className="no-imprimir" style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14,alignItems:"center"}}>
      {[["semana","Semana"],["mes","Mes"],["trimestre","Trimestre"],["rango","Rango"]].map(([id,lbl])=>(
        <button key={id} onClick={()=>aplicar(id)} style={{...Btn(periodo===id?O:"transparent",periodo===id?D:GR,{padding:"7px 16px",fontSize:12})}}>{lbl}</button>
      ))}
      <button onClick={()=>window.print()} style={{...Btn("transparent",W,{padding:"7px 16px",fontSize:12,marginLeft:"auto"})}}>🖨️ Imprimir</button>
    </div>

    {/* Encabezado que solo sale en el papel */}
    <div className="solo-imprimir">
      <h1>Reporte de producción — Planta Rolleras</h1>
      <p>Coop El Círculo · del {fdate(desde)} al {fdate(hasta)} · emitido el {fdate(hoyIso())}</p>
    </div>
    {periodo==="rango"&&<div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
      <div><div style={{color:GR,fontSize:10,marginBottom:4}}>DESDE</div><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...inp,width:150,fontSize:12,padding:"7px 10px"}}/></div>
      <div><div style={{color:GR,fontSize:10,marginBottom:4}}>HASTA</div><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...inp,width:150,fontSize:12,padding:"7px 10px"}}/></div>
    </div>}

    {rolleras.length>1&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16,alignItems:"center"}}>
      <span style={{color:GR,fontSize:11,marginRight:4}}>MÁQUINA:</span>
      {["todas",...rolleras].map(r=>(
        <button key={r} onClick={()=>setRollera(r)} style={{...Btn(rollera===r?PU:"transparent",rollera===r?D:GR,{padding:"6px 14px",fontSize:12,borderColor:rollera===r?PU:BR})}}>
          {r==="todas"?"Todas":tituloMaquina(r)}
        </button>
      ))}
    </div>}

    <div style={{color:GR,fontSize:11,marginBottom:14}}>
      {fdate(desde)} al {fdate(hasta)}
      {rollera!=="todas"&&<span style={{color:PU}}> · solo {tituloMaquina(rollera)}</span>}
    </div>

    {cargando?<p style={{color:GR,fontSize:12}}>Cargando...</p>:
     bobinas.length===0?(
      <div style={{textAlign:"center",padding:40,color:GR,background:CA,border:"1px solid "+BR,borderRadius:12}}>
        <p>No hay datos en este período.</p>
      </div>
     ):(<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:18}}>
        <StatCard v={fnum(kilos)} l="Kilos" s={producciones.length+" turnos"} c={O}/>
        <StatCard v={bobinas.length} l="Bobinas" s={bobinas.length?fnum(Math.round(kilos/bobinas.length))+" kg c/u":"—"} c={W}/>
        <StatCard v={mal.length} l="Con error" s={pctError+(sinEstado?" · "+sinEstado+" sin marcar":"")} c={mal.length?RE:GN}/>
        <StatCard v={fnum(se+sr)} l="Scrap (kg)" s={pctScrap.toFixed(2)+"% de lo producido"} c={pctScrap>3?RE:BL}/>
        <StatCard v={millares(totalBolsas)} l="Millares de bolsas" s={rollos===null?"falta el SQL 16":fnum(totalRollos)+" rollos · "+turnosRollos+" turnos"} c={GN}/>
      </div>

      <Caja titulo={"📦 Millares de bolsas "+(porMes?"por mes":"por semana")}>
        {rollos===null?<p style={{color:O,fontSize:12}}>Falta correr el SQL 16 en Supabase.</p>:
         rollosPeriodos.length===0?<p style={{color:GR,fontSize:12}}>No se cargaron rollos en este período. Se cargan en Monitoreo → Rollos por turno.</p>:
         rollosPeriodos.map(p=>(
          <div key={p.clave} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4,gap:8,flexWrap:"wrap"}}>
              <span style={{color:W,fontWeight:600}}>{etiquetaPeriodo(p.clave)}</span>
              <span style={{color:GR}}>{Object.entries(p.maq).sort().map(([m,n])=>tituloMaquina(m)+": "+millares(n)).join(" · ")}</span>
              <span style={{color:GN,fontWeight:700}}>{millares(p.bolsas)} millares</span>
            </div>
            <Barra valor={p.bolsas} max={maxRollosPer} color={GN}/>
          </div>
        ))}
      </Caja>
      <div style={{height:14}}/>

      <Caja titulo="♻️ Scrap: dónde y cuándo se tira más">
        {se+sr===0?<p style={{color:GR,fontSize:12}}>No hay scrap cargado en este período.</p>:(<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:16}}>
            <div style={{background:D,borderRadius:8,padding:10}}>
              <div style={{color:GR,fontSize:9,letterSpacing:1}}>EMPALME</div>
              <div style={{color:BL,fontWeight:700,fontSize:15}}>{fnum(se)} kg</div>
              <div style={{color:GR,fontSize:10}}>{se+sr?(100*se/(se+sr)).toFixed(0):0}% del scrap</div>
            </div>
            <div style={{background:D,borderRadius:8,padding:10}}>
              <div style={{color:GR,fontSize:9,letterSpacing:1}}>ROLLO</div>
              <div style={{color:PU,fontWeight:700,fontSize:15}}>{fnum(sr)} kg</div>
              <div style={{color:GR,fontSize:10}}>{se+sr?(100*sr/(se+sr)).toFixed(0):0}% del scrap</div>
            </div>
            {scrapTurno.map(t=>(
              <div key={t.turno} style={{background:D,borderRadius:8,padding:10}}>
                <div style={{color:GR,fontSize:9,letterSpacing:1}}>TURNO {t.turno.toUpperCase()}</div>
                <div style={{color:t.pct>3?RE:W,fontWeight:700,fontSize:15}}>{fnum(t.total)} kg</div>
                <div style={{color:GR,fontSize:10}}>{t.pct.toFixed(2)}% de lo que produjo</div>
              </div>
            ))}
          </div>

          {rollera==="todas"&&scrapMaq.length>1&&<div style={{marginBottom:16}}>
            <div style={{color:GR,fontSize:11,marginBottom:8}}>POR MÁQUINA</div>
            {scrapMaq.map((m,i)=>(
              <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                  <span style={{color:W,fontWeight:600}}>{tituloMaquina(m.maquina)}</span>
                  <span style={{color:m.pct>3?RE:BL,fontWeight:700}}>{fnum(m.total)} kg · {m.pct.toFixed(2)}%</span>
                </div>
                <Barra valor={m.total} max={scrapMaq[0].total} color={m.pct>3?RE:BL}/>
              </div>
            ))}
          </div>}

          <div style={{color:GR,fontSize:11,marginBottom:8}}>LOS TURNOS QUE MÁS TIRARON</div>
          {peoresTurnos.map((p,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:12,
                 padding:"7px 0",borderBottom:i<peoresTurnos.length-1?"1px solid "+BR:"none"}}>
              <span style={{color:W}}>{tituloMaquina(p.maquina)} · {fdate(p.fecha)} · {p.turno}</span>
              <span style={{color:p.pct>3?RE:GR,fontWeight:700,whiteSpace:"nowrap"}}>{fnum(p.scrap)} kg · {p.pct.toFixed(1)}%</span>
            </div>
          ))}
        </>)}
      </Caja>
      <div style={{height:14}}/>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:14,marginBottom:14}}>
        <Caja titulo="⚠️ Operarios con más errores">
          {ops.length===0?<p style={{color:GR,fontSize:12}}>Sin datos.</p>:ops.map((o,i)=>(
            <div key={i} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                <span style={{color:W,fontWeight:600}}>{o.nombre}</span>
                <span style={{color:o.mal?RE:GN,fontWeight:700}}>{o.mal} de {o.total}</span>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <Barra valor={o.mal} max={maxMal} color={RE}/>
                <span style={{color:GR,fontSize:10,minWidth:44,textAlign:"right"}}>{o.total?(100*o.mal/o.total).toFixed(0):0}%</span>
              </div>
            </div>
          ))}
        </Caja>

        <Caja titulo="🔧 Defectos más comunes">
          {defs.length===0?<p style={{color:GR,fontSize:12}}>Sin defectos registrados.</p>:defs.map((d,i)=>(
            <div key={i} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                <span style={{color:W}}>{i+1}. {d.nombre}</span>
                <span style={{color:O,fontWeight:700}}>{d.cant}</span>
              </div>
              <Barra valor={d.cant} max={maxDef} color={O}/>
            </div>
          ))}
        </Caja>

        <Caja titulo="🏭 Kilos por rollera">
          {maqs.map((m,i)=>(
            <div key={i} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                <span style={{color:W,fontWeight:600}}>{tituloMaquina(m.maquina)}</span>
                <span style={{color:O,fontWeight:700}}>{fnum(m.kilos)} kg</span>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <Barra valor={m.kilos} max={maxKilos} color={PU}/>
                <span style={{color:GR,fontSize:10,minWidth:70,textAlign:"right"}}>{m.total} bob · {m.mal} mal</span>
              </div>
            </div>
          ))}
        </Caja>

        <Caja titulo="🔎 Buscar bobina">
          <p style={{color:GR,fontSize:11,marginBottom:10,lineHeight:1.5}}>
            Si una bobina salió con una falla grave, buscá su número para saber quién la hizo
            y de qué máquina de origen vino.
          </p>
          <input style={inp} value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="Número de bobina, ej: 10-189"/>
          {buscar.trim()&&(encontradas.length===0
            ? <p style={{color:GR,fontSize:12,marginTop:12}}>No aparece en este período. Probá ampliando el rango.</p>
            : <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8,maxHeight:260,overflowY:"auto"}}>
                {encontradas.map((b,i)=>(
                  <div key={i} style={{background:D,borderRadius:8,padding:10,fontSize:12,
                       borderLeft:"3px solid "+(b.estado==="MAL"?RE:GN)}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{color:W,fontWeight:700}}>N° {b.n_bobina}</span>
                      <span style={{color:b.estado==="MAL"?RE:GN,fontWeight:700}}>{b.estado||"—"}</span>
                    </div>
                    <div style={{color:GR,fontSize:11,lineHeight:1.6}}>
                      Operario: <span style={{color:W}}>{b.operario_bobina||"S/D"}</span> · {fnum(b.peso)} kg<br/>
                      {tituloMaquina(b.maquina)} · {fdate(b.fecha)} · turno {b.turno}<br/>
                      {b.maquina_origen?<>Bobina de máquina <span style={{color:W}}>{b.maquina_origen}</span><br/></>:null}
                      {b.defectos?<span style={{color:O}}>Defecto: {b.defectos}</span>:null}
                    </div>
                  </div>
                ))}
              </div>)}
        </Caja>
      </div>

      <div className="no-imprimir" style={{marginTop:20}}>
        {(()=>{
          // Los problemas se calculan con los datos reales de cada hoja: al
          // corregirla, la marca desaparece sola.
          const porHoja={};
          todasBobinas.forEach(b=>(porHoja[b.produccion_id]=porHoja[b.produccion_id]||[]).push(b));
          const hojas=producciones.map(p=>({p,problemas:problemasHoja(p,porHoja[p.id])}))
            .sort((a,b)=>(b.problemas.length>0)-(a.problemas.length>0));
          const pendientes=hojas.filter(h=>h.problemas.length).length;
          const visibles=soloRevisar?hojas.filter(h=>h.problemas.length):hojas;
          return(<>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}}>
              <h3 style={{color:W,fontSize:13,margin:0,fontWeight:700}}>🛠 Hojas cargadas en el período</h3>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setSoloRevisar(true)} style={{...Btn(soloRevisar?O:"transparent",soloRevisar?D:GR,{padding:"6px 12px",fontSize:11})}}>Para revisar ({pendientes})</button>
                <button onClick={()=>setSoloRevisar(false)} style={{...Btn(!soloRevisar?O:"transparent",!soloRevisar?D:GR,{padding:"6px 12px",fontSize:11})}}>Todas ({hojas.length})</button>
              </div>
            </div>
            <p style={{color:GR,fontSize:11,marginBottom:12,lineHeight:1.5}}>
              {soloRevisar
                ?"Solo las hojas con algo raro, con el motivo en naranja. Corregila y sale sola de esta lista."
                :"Todas las hojas del período. Las que tienen algo para revisar aparecen primero, en naranja."}
            </p>
            {soloRevisar&&pendientes===0&&
              <div style={{color:GN,fontSize:12,padding:12,background:GN+"15",borderRadius:8}}>✓ No hay hojas para revisar en este período.</div>}
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {visibles.map(({p,problemas})=>{
                const marcada=problemas.length>0;
                return(<div key={p.id} style={{background:CA,border:"1px solid "+(marcada?O:BR),borderRadius:10,
                     padding:"11px 13px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <div style={{fontSize:12,flex:1,minWidth:200}}>
                    <div style={{color:W,fontWeight:700}}>
                      {tituloMaquina(p.maquina)} · {fdate(p.fecha)} · {p.turno}
                      {p.operario&&<span style={{color:GR,fontWeight:400}}> · {p.operario}</span>}
                    </div>
                    <div style={{color:GR,fontSize:11,marginTop:2}}>
                      {p.medida||"sin medida"} · {p.bobinas} bobinas · {fnum(p.kilos)} kg · {p.bien} bien / {p.mal} mal
                    </div>
                    {problemas.map((t,i)=>(
                      <div key={i} style={{color:O,fontSize:11,marginTop:4,lineHeight:1.5}}>⚠️ {t}</div>
                    ))}
                  </div>
                  <button onClick={()=>setCorrigiendo(p)} style={{...Btn(marcada?O:"transparent",marcada?D:O,{fontSize:11,padding:"7px 13px",borderColor:O})}}>✏️ Corregir</button>
                </div>);
              })}
            </div>
          </>);
        })()}
      </div>
     </>)}

    {corrigiendo&&<Modal title={"Corregir — "+tituloMaquina(corrigiendo.maquina)+" · "+fdate(corrigiendo.fecha)} onClose={()=>setCorrigiendo(null)}>
      <CorregirHoja hoja={corrigiendo} onCerrar={()=>setCorrigiendo(null)} onCambio={recargar}/>
    </Modal>}
  </div>);
}

// ── App ──────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("monitoreo");
  const [maquinas,setMaquinas]=useState([]);
  const [eventos,setEventos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [perfil,setPerfil]=useState(null);
  const [modalMaquina,setModalMaquina]=useState(null);
  const [modalEvento,setModalEvento]=useState(null);
  const isMobile=useMobile();

  useEffect(()=>{
    (async()=>{
      const p=await initAuth();
      if(!p){window.location.href="index.html";return;}
      setPerfil(p);
      try{
        const data=await db.loadAll();
        setMaquinas(data.maquinas);
        setEventos(data.eventos);
      }catch(e){console.error("Error cargando datos:",e);}
      setLoading(false);
      const s=document.getElementById("splash");
      if(s){s.style.opacity="0";setTimeout(()=>s.remove(),400);}
    })();
  },[]);

  if(loading) return null;

  const activas = maquinas.filter(m=>m.activa!==false);
  const pendientes = eventos.filter(e=>!e.resuelto);
  const porTipo = t => pendientes.filter(e=>e.tipo===t).length;

  const guardarMaquina = async d => { await db.saveMaquina(d,setMaquinas); setModalMaquina(null); };
  const guardarEvento = async d => { await db.saveEvento({...d,creadoPor:perfil?.nombre||""},setEventos); setModalEvento(null); };
  const resolver = async e => await db.marcarResuelto(e.id,!e.resuelto,setEventos);
  const eliminarEvento = async e => { if(confirm("¿Eliminar este evento?"))await db.delEvento(e.id,setEventos); };

  return(
    <div style={{minHeight:"100vh",fontFamily:"Montserrat,sans-serif",background:D,color:W}}>
      <Header nombre={perfil?.nombre} tab={tab} setTab={setTab} isMobile={isMobile}/>
      <div style={{padding:isMobile?14:24,maxWidth:1100,margin:"0 auto"}}>
        {tab==="monitoreo"&&<Monitoreo perfil={perfil}/>}
        {tab==="maquinas"&&(<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:24}}>
            <StatCard v={activas.length} l="Máquinas activas" s={maquinas.length-activas.length>0?(maquinas.length-activas.length)+" fuera de servicio":"todas operativas"} c={W}/>
            <StatCard v={pendientes.length} l="Eventos pendientes" s="sin resolver" c={pendientes.length>0?O:GN}/>
            <StatCard v={porTipo("rotura")} l="Roturas" s="pendientes" c={RE}/>
            <StatCard v={porTipo("repuesto")+porTipo("insumo")} l="Repuestos/insumos" s="por comprar" c={BL}/>
          </div>
          <MaquinasGrid
            maquinas={maquinas} eventos={eventos}
            onEditar={m=>setModalMaquina({...m})}
            onNuevoEvento={m=>setModalEvento({maquinaId:m.id,tipo:"rotura",descripcion:"",fecha:hoyIso()})}
          />
          <EventosFeed eventos={eventos} maquinas={maquinas} onResolver={resolver} onEliminar={eliminarEvento}/>
        </>)}
        {tab==="reportes"&&<Reportes/>}
        {tab==="cargar"&&<CargarHoja perfil={perfil} onCargado={()=>{}}/>}
        {tab==="produccion"&&<Produccion/>}
      </div>

      {modalMaquina&&<Modal title="Editar máquina" onClose={()=>setModalMaquina(null)}>
        <MaquinaForm init={modalMaquina} onSave={guardarMaquina} onClose={()=>setModalMaquina(null)}/>
      </Modal>}
      {modalEvento&&<Modal title="Nuevo evento" onClose={()=>setModalEvento(null)}>
        <EventoForm init={modalEvento} maquinas={maquinas} onSave={guardarEvento} onClose={()=>setModalEvento(null)}/>
      </Modal>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
